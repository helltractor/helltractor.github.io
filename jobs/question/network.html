con sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="sakura-nav-link-text &lt;lg:hidden" data-v-59573570>追番列表</span><!--[--><!--]--><!--]--></a><!--]--><!----></div><div class="sakura-dropdown sakura-navbar-link-item" aria-haspopup="true" aria-expanded="false" data-v-b00b65a0 data-v-6db7c45f data-v-ac3e8a66><!--[--><a class="va-link sakura-nav-link" title="RSS" rel="noopener" data-v-6db7c45f href="/atom.xml" target="_blank" data-v-59573570><!--[--><span class="i-ri-rss-line hvr-icon sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="&lt;lg:hidden sakura-nav-link-text" data-v-59573570>RSS</span><!--[--><!--]--><!--]--><!----></a><!--]--><!----></div><!--]--><!----></nav><!--]--><!--[--><div h-full print:op0 flex="~ center" class="sakura-navbar-tools"><button class="sakura-icon-btn sakura-toggle-dark select-none" type="button" aria-label="Toggle Color Scheme"><div class="i-line-md-moon-alt-to-sunny-outline-loop-transition"></div></button><!----><div flex="center"><button class="sakura-icon-btn sakura-search-btn" title="搜索"><div i-mdi-search></div></button><!----></div><!----><!--[--><!--]--></div><!--]--></div></header><!--]--><!--]--><main class="sakura-sidebar-offset sakura-main" data-v-1c94aaa0><!--[--><!--[--><!--[--><!--]--><!--[--><!--]--><!--[--><template><article class="markdown-body min-w-0"><!--[--><div class="max-w-none prose"><!--[--><h2 id="基础" tabindex="-1">基础 <a class="header-anchor" href="#基础" aria-label="Permalink to &quot;基础&quot;">​</a></h2><details class="details custom-block"><summary>OSI 模型</summary><p>OSI 模型是一个分层的网络通信模型，共有七层，分别是应用层、表示层、会话层、传输层、网络层、数据链路层和物理层。它们的职能如下：</p><ul><li>应用层，负责给应用程序提供统一的接口；</li><li>表示层，负责把数据转换成兼容另一个系统能识别的格式；</li><li>会话层，负责建立、管理和终止表示层实体之间的通信会话；</li><li>传输层，负责端到端的数据传输；</li><li>网络层，负责数据的路由、转发、分片；</li><li>数据链路层，负责数据的封帧和差错检测，以及 MAC 寻址；</li><li>物理层，负责在物理网络中传输数据帧；</li></ul></details><details class="details custom-block"><summary>TCP/IP 模型</summary><p>TCP/IP 模型共有四层，分别是应用层、传输层、网络层和数据链路层。它们的职能如下：</p><ul><li>应用层，负责向用户提供一组应用程序，比如 HTTP、DNS、FTP 等;</li><li>传输层，负责端到端的通信，比如 TCP、UDP 等；</li><li>网络层，负责网络包的封装、分片、路由、转发，比如 IP、ICMP 等；</li><li>网络接口层，负责网络包在物理网络中的传输，比如网络包的封帧、 MAC 寻址、差错检测，以及通过网卡传输网络帧等；</li></ul></details><h2 id="http" tabindex="-1">HTTP <a class="header-anchor" href="#http" aria-label="Permalink to &quot;HTTP&quot;">​</a></h2><details class="details custom-block"><summary>HTTP 与 HTTPS 的区别？</summary><ul><li><strong>端口号</strong>：HTTP 默认是 80，HTTPS 默认是 443。</li><li><strong>URL 前缀</strong>：HTTP 的 URL 前缀是 <code>http://</code>，HTTPS 的 URL 前缀是 <code>https://</code>。</li><li><strong>安全性和资源消耗</strong>：HTTP 协议运行在 TCP 之上，所有传输的内容都是明文，客户端和服务器端都无法验证对方的身份。HTTPS 是运行在 SSL/TLS 之上的 HTTP 协议，SSL/TLS 运行在 TCP 之上。所有传输的内容都经过加密，加密采用对称加密，但对称加密的密钥用服务器方的证书进行了非对称加密。所以说，HTTP 安全性没有 HTTPS 高，但是 HTTPS 比 HTTP 耗费更多服务器资源。</li></ul></details><details class="details custom-block"><summary>HTTP 建立连接的过程（访问网页的全过程）？</summary><ol><li>在浏览器中输入指定网页的 URL。</li><li>浏览器通过 DNS 协议，获取域名对应的 IP 地址。</li><li>浏览器根据 IP 地址和端口号，向目标服务器发起一个 TCP 连接请求。</li><li>浏览器在 TCP 连接上，向服务器发送一个 HTTP 请求报文，请求获取网页的内容。</li><li>服务器收到 HTTP 请求报文后，处理请求，并返回 HTTP 响应报文给浏览器。</li><li>浏览器收到 HTTP 响应报文后，解析响应体中的 HTML 代码，渲染网页的结构和样式，同时根据 HTML 中的其他资源的 URL（如图片、CSS、JS 等），再次发起 HTTP 请求，获取这些资源的内容，直到网页完全加载显示。</li><li>浏览器在不需要和服务器通信时，可以主动关闭 TCP 连接，或者等待服务器的关闭请求。</li></ol></details><details class="details custom-block"><summary>HTTPS 的加密方式？</summary><p>HTTPS 是运行在 SSL/TLS 之上的 HTTP 协议，SSL/TLS 运行在 TCP 之上。所有传输的内容都经过加密，加密采用对称加密，但对称加密的密钥用服务器方的证书进行了非对称加密。<s>所以说，HTTP 安全性没有 HTTPS 高，但是 HTTPS 比 HTTP 耗费更多服务器资源。</s></p><ul><li><strong>非对称加密</strong>：用于密钥交换。在这种加密模式下，有一对密钥，分别是公钥和私钥。公钥可以公开，用于加密信息；私钥必须保密，用于解密信息。非对称加密安全性高，但处理速度相对较慢。</li><li><strong>对称加密</strong>：用于数据传输。对称加密使用同一把密钥进行数据的加密和解密，处理速度快，但密钥的分发是个问题。HTTPS 中，对称加密的密钥是在安全的环境下通过非对称加密交换的。</li></ul></details><details class="details custom-block"><summary>服务器流量扛不住了做扩容操作，域名解析的 IP 会如何变动？</summary><p><strong>负载均衡：</strong></p><ul><li>域名解析到一个 <strong>负载均衡器（如 Nginx、LVS、SLB）</strong> 的公网 IP；</li><li>负载均衡器再将请求分发到后端的多台服务器；</li><li>客户端始终只访问同一个域名，无需感知后端服务器扩容或缩容。</li></ul><p><strong>DNS 轮询：</strong></p><ul><li>一个域名可以配置多个 <strong>A 记录</strong>，每个 A 记录对应一台服务器的 IP；</li><li>DNS 解析时会轮询返回其中一个 IP，客户端随机访问不同服务器；</li><li><strong>缺点：</strong> DNS 缓存时间较长，扩容/缩容生效不够及时，调度粒度较粗。</li></ul><p><strong>CDN：</strong></p><ul><li>域名解析到 <strong>CDN 厂商提供的节点 IP</strong>；</li><li>用户请求会先到达离自己最近的 CDN 节点，再由 CDN 回源到服务器集群；</li><li><strong>优点：</strong> 适合静态资源分发、跨地域加速、缓解源站压力。</li></ul></details><h2 id="tcp" tabindex="-1">TCP <a class="header-anchor" href="#tcp" aria-label="Permalink to &quot;TCP&quot;">​</a></h2><h3 id="三次握手" tabindex="-1">三次握手 <a class="header-anchor" href="#三次握手" aria-label="Permalink to &quot;三次握手&quot;">​</a></h3><div class="mermaid"></div><h3 id="四次挥手" tabindex="-1">四次挥手 <a class="header-anchor" href="#四次挥手" aria-label="Permalink to &quot;四次挥手&quot;">​</a></h3><div class="mermaid"></div><details class="details custom-block"><summary>如何解决粘包？</summary><p>粘包问题是由于 TCP 协议的特性造成的，TCP 是一个面向字节流的协议，它并不关心数据的边界，只是把数据当成一个连续的字节流来处理。 粘包的问题出现在不知道一个用户消息的边界在哪，如果知道了边界在哪，接受方就可以通过边界划分出有效的用户消息。</p><p>解决粘包的方法有：</p><ul><li>通过消息长度来划分消息边界；</li><li>通过特殊字符来划分消息边界，比如换行符、分号等；</li><li>通过自定义消息结构来划分消息边界，比如在消息头中添加消息长度字段等；</li></ul><hr><p>操作系统的 TCP 协议栈主要负责：</p><ul><li>维护连接状态，TCP 连接的建立和断开；</li><li>按顺序接受和发送数据包；</li><li>自动重传丢失的数据包；</li><li>合并 TCP 段，放到内核的 socket 缓冲区；</li></ul></details><details class="details custom-block"><summary>为什么是三次握手？不是两次、四次？</summary><p>TCP 建立连接时，通过三次握手能防止历史连接的建立，能减少双方不必要的资源开销，能够帮助双方同步初始化序列号。序列号不能保证数据包不重复、不丢弃和按序传输。</p><p>不使用<strong>两次握手</strong>和<strong>四次握手</strong>的原因：</p><ul><li>两次握手：无法防止历史连接的建立，会造成双方资源的浪费，也无法可靠的同步双方序列号；</li><li>四次握手：三次握手已经是理论上最少可靠连接建立的次数，所以不需要使用更多的通信次数。</li></ul></details><h2 id="cookie-和-session" tabindex="-1">Cookie 和 Session <a class="header-anchor" href="#cookie-和-session" aria-label="Permalink to &quot;Cookie 和 Session&quot;">​</a></h2><details class="details custom-block"><summary>cookie 和 session 的区别</summary><p><strong><code>Session</code> 的主要作用就是通过服务端记录用户的状态。</strong> 典型的场景是购物车，当你要添加商品到购物车的时候，系统不知道是哪个用户操作的，因为 HTTP 协议是无状态的。服务端给特定的用户创建特定的 <code>Session</code> 之后就可以标识这个用户并且跟踪这个用户了。</p><p><code>Cookie</code> 数据保存在客户端(浏览器端)，<code>Session</code> 数据保存在服务器端。相对来说 <code>Session</code> 安全性更高。如果使用 <code>Cookie</code> 的一些敏感信息不要写入 <code>Cookie</code> 中，最好能将 <code>Cookie</code> 信息加密然后使用到的时候再去服务器端解密。</p></details><!--]--></div><!--[--><!--]--><!--[--><!--]--><!--]--><!----><!----></article></template><!--]--><!--[--><!--]--><!--[--><!--]--><!--[--><!--]--><!----><!--[--><!--]--><!--]--><!--]--></main><!--[--><div data-v-1c94aaa0 style="display:none;" data-v-a46f6f61><div data-v-a46f6f61></div><img class="sakura-to-top-node" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEYAAABmCAMAAABBXBeAAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAvdQTFRFAAAAAAAAAgICAwMDDQsLDg0NCgkJAwICAAAACAcHBwYGFRISQyMecTYtAQAADAsLEQ8PNzU1WVVUaGhob29vdHR0bWpqVVBPJSQkERAQBgUFGBYWEBAQDQsLSkpKkZGRzMzM5OPk9PPz/////fv76enpzs7OpaWlZWVlMjAwExISDg0NAwEBHh4eBQUFBAQESEVEqKio9vb2//7+2dnZYGBgBAQEAgICDgoKKigoh4eH1tXV4ODgAQEBBgICGxkaOTk57e3t+Pj4/v39tLS0xsbGQD4+FBMTCAgIGxISGxgYq6ur/Pr63NzcoaGhmZmZAAAAEg8Pv7+/0tLSlJSUjY2NFRQUFBQUAwAADQwMLx8fISAg8fHxubm5iYmJSC8uBQUFDgwM6+vrenp6g4KCBAEBr6+vFhUVwbKy5+fnnZ2dHRwcybu65tjY6t3c8eno+PT0XFxct6mp5NbV4dPR4dHQ6NnZ9vDwYmJiQkJCGhgXsKWk5tbW4M/P6t/e+vb2DAsLAgEB18PD49TT38zL49PS387N3MjK+/j4zMrKFxYW4cXRZGRk+PHzFxUV0L282tra7uTjFxUVGhkZeXBvFxcXICAgTkBB6Nvb7+Dg9e7skYiHAAAA1L2/2tTU7OLhraGgMCsq08jHFhQUl42LCwoKw7W1BQQE8OflKyIhDgsLpJuagnp48uvpopeWdGtpt6KhqpOSwKWkt5iXrZCOBwcHjGJhgFJQfD87ejcwbTErXCgjYysmdjYujU1KpoJ/YFlYi4B/zra0nmZmfTgxVScig0A6jUE3XiwncjQtfzsyajg1mE5IoFFJpk9BikI2r1RFslZGaTIplUc6ok0/ikdAal5eGwkJgz0zfDsxqlJDkUQ5k0Q5gjsyMxYUiEA1mUg8KBEOhT00ai8pZi4oAwICdDUtBgECQx0bTiIeq1JDnUk9gElGo3Nxi1ZVxampn4B8q42JjnZz2MrJl3x59evqknp3KioqqYmFnJKQDAwMERERhYWFx3P0eAAAAP10Uk5TABA6b6nR6/v//9W8sm8W5vv7//////////9ioe3/////////////////3nkmuPn/////////V0il/////yEzh//////////nQpX///////8cjv//////dQaAif////+hLsn///8L/8P////////////////////////M///

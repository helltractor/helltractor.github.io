JOIN</code> 代替，避免临时表和无索引。</li><li>多表 <code>JOIN</code>：小结果集表优先做驱动表。</li><li>大偏移分页优化：用索引范围过滤再 <code>LIMIT</code>。</li></ul><h2 id="索引设计规范" tabindex="-1">索引设计规范 <a class="header-anchor" href="#索引设计规范" aria-label="Permalink to &quot;索引设计规范&quot;">​</a></h2><ol><li><p>正确理解和计算索引字段的区分度，下面是计算规则区分度高的索引，可以快速得定位数据，区分度太低，无法有效的利用索引，可能需要扫描大量数据页，和不使用索引没什么差别。我们创建索引的时候，尽量选择区分度高的列作为索引。计算规则：<code>selecttivity = count(distinct c_name)/count(\*)</code>。</p></li><li><p>正确理解和计算前缀索引的字段长度，合适的长度要保证高的区分度和最恰当的索引存储容量，只有达到最佳状态，才是保证高效率的索引。计算规则：<code>select count(distinct left(c_name , calcul_len)) / count(\*) from t_name;</code>。下面长度为 6 的时候是最佳状态。</p><div class="language-shell max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">shell</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#6F42C1;--shiki-dark:#B392F0;">mysql</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">&gt;  </span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;">SELECT</span></span>

der-anchor" href="#慢-sql-优化步骤" aria-label="Permalink to &quot;慢 SQL 优化步骤&quot;">​</a></h2><ol><li>先运行查看实际耗时，判断是否真的很慢（注意设置<code>SQL_NO_CACHE</code>）。</li><li><code>EXPLAIN</code> 查看执行计划，是否与 1 预期一致（从锁定记录较少的表开始查询）。</li><li>高区分度优先策略：<code>WHERE</code> 条件单表排查，锁定最小返回记录表的条件。 就是查询语句的 <code>WHERE</code> 都应用到表中返回的记录数最小的表开始查起，单表每个字段分别查询，看哪个字段的区分度最高。区分度高的字段往前排。</li><li>涉及<code>ORDER BY</code>、<code>GROUP BY</code> 形式的 sql 语句的表优先排查。</li><li>了解业务方的使用场景，根据使用场景适时调整。</li><li>增加索引时参照建索引设计规范。</li><li>观察结果，不符合预期继续从 1 开始分析。</li></ol><h2 id="常见问题" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题" aria-label="Permalink to &quot;常见问题&quot;">​</a></h2><ul><li>数据库结构优化</li><li>MySQL 数据库 CPU 使用率飙升的原因</li><li>为什么要分库分表</li><li>分库分表的具体实施策略</li><li>分库分表存在那些问题</li><li>什么是 MySQL 主从复制</li><li>MySQL 主从复制的工作原理</li><li>MySQL 读写分离的实现方案</li></ul><details class="details custom-block"><summary>Explain 的作用是什么？</summary><p>Explain 是 MySQL 提供的用于分析查询语句的工具，可以帮助开发人员分析查询语句的性能，找出可能存在的问题。重要的关注指标包括：<strong>select_type、type、possible_keys、key、rows</strong> 等。</p><table><thead><tr><th style="text-align:left;">字段</th><th style="text-align:left;">说明</th></tr></thead><tbody><tr><td style="text-align:left;">id</td><td style="text-align:left;">查询的序列号，表示查询中执行 select 子句或操作表的顺序</td></tr><tr><td style="text-align:left;">select_type</td><td style="text-align:left;">查询的 select 子句类型，主要有：SIMPLE、PRIMARY、SUBQUERY、DERIVED、UNION、UNION RESULT 等</td></tr><tr><td style="text-align:left;">table</td><td style="text-align:left;">查询的表</td></tr><tr><td style="text-align:left;">type</td><td style="text-align:left;">查询的类型方式，主要有：system、const、eq_ref、ref、range、index、all 等</td></tr><tr><td style="text-align:left;">possible_keys</td><td style="text-align:left;">可能使用的索引，表示 MySQL 能使用哪个索引在表中找到记录，查询涉及到的字段上若存在索引，则该索引将被列出，但不一定被查询使用。这个趋向于指导性作用。</td></tr><tr><td style="text-align:left;">key</td><td style="text-align:left;">实际使用的索引，显示 MySQL 在查询中实际使用的索引，若没有使用索引，显示为 NULL</td></tr><tr><td style="text-align:left;">key_len</td><td style="text-align:left;">使用的索引的长度</td></tr><tr><td style="text-align:left;">ref</td><td style="text-align:left;">显示索引的哪一列被使用了，如果可能的话，是一个常数</td></tr><tr><td style="text-align:left;">rows</td><td style="text-align:left;">MySQL 查询时预估扫描的行数</td></tr><tr><td style="text-align:left;">Extra</td><td style="text-align:left;">额外的信息，包括不适合在其他列中显示但是还是重要的信息</td></tr></tbody></table></details><details class="details custom-block"><summary>慢 SQL 优化如何实现？</summary><p><strong>定位慢 SQL：</strong></p><ol><li><p>开启慢查询日志，在 mysql.slow_log 或文件中找到慢 SQL。</p><div class="language-sql max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">sql</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">SET</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> GLOBAL</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> slow_query_log </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">=</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> on</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">; </span><span style="--shiki-light:#6A737D;--shiki-dark:#6A737D;">-- 默认关闭</span></span>
<span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">SET</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> GLOBAL</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> long_query_time </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">=</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;"> 1</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">; </span><span style="--shiki-light:#6A737D;--shiki-dark:#6A737D;">-- 记录执行时间超过 1s 的 SQL</span></span></code></pre><button class="code-block-unfold-btn"></button></div></li><li><p>使用 EXPLAIN 分析执行计划，查看是否命中索引、扫描行数（rows）、是否使用 filesort / temporary。</p><div class="language-sql max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">sql</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">EXPLAIN </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">SELECT</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> *</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> FROM</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> user </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">WHERE</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> name=</span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;">&#39;helltractor&#39;</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">;</span></span></code></pre><button class="code-block-unfold-btn"></button></div></li></ol><p><strong>常见优化手段：</strong></p><ol><li>索引优化 <ul><li>区分度：根据区分度判断是否建立索引。</li><li>建立合适索引：单列索引、联合索引、覆盖索引。 <ul><li>联合索引注意最左前缀原则，避免索引下推，减少回表次数。</li><li>进行排序、分组字段需要添加在索引后面，形成覆盖索引。</li></ul></li><li>避免索引失效的场景： <ul><li>联合索引遇到范围匹配。</li><li><code>LIKE &#39;%xxx&#39;</code> 前缀模糊匹配。</li><li>在索引列上进行计算或函数操作：<code>WHERE YEAR(date)=2025</code>。</li><li>类型不一致的比较：<code>WHERE id = &#39;123&#39;</code>（id 是 int）。</li></ul></li></ul></li><li>SQL 语句优化 <ul><li>避免 <code>SELECT *</code>的使用，造成不必要的回表。</li><li>避免 <code>IN</code> 大量子查询，替换为 <code>JOIN</code> 或 <code>EXISTS</code>。</li><li>减少 <code>OR</code>的使用，替换<code>UNION ALL</code>或<code>IN</code>。</li><li>避免索引失效的场景发生。</li></ul></li></ol></details><!--]--></div><!--[--><!--]--><!--[--><!--]--><!--]--><!----><!----></article></template><!--]--><!--[--><!--]--><!--[--><!--]--><!--[--><!--]--><!----><!--[--><!--]--><!--]--><!--]--></main><!--[--><div data-v-1c94aaa0 style="display:none;" data-v-a46f6f61><div data-v-a46f6f61></div><img class="sakura-to-top-node" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEYAAABmCAMAAABBXBeAAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAvdQTFRFAAAAAAAAAgICAwMDDQsLDg0NCgkJAwICAAAACAcHBwYGFRISQyMecTYtAQAADAsLEQ8PNzU1WVVUaGhob29vdHR0bWpqVVBPJSQkERAQBgUFGBYWEBAQDQsLSkpKkZGRzMzM5OPk9PPz/////fv76enpzs7OpaWlZWVlMjAwExISDg0NAwEBHh4eBQUFBAQESEVEqKio9vb2//7+2dnZYGBgBAQEAgICDgoKKigoh4eH1tXV4ODgAQEBBgICGxkaOTk57e3t+Pj4/v39tLS0xsbGQD4+FBMTCAgIGxISGxgYq6ur/Pr63NzcoaGhmZmZAAAAEg8Pv7+/0tLSlJSUjY2NFRQUFBQUAwAADQwMLx8fISAg8fHxubm5iYmJSC8uBQUFDgwM6+vrenp6g4KCBAEBr6+vFhUVwbKy5+fnnZ2dHRwcybu65tjY6t3c8eno+PT0XFxct6mp5NbV4dPR4dHQ6NnZ9vDwYmJiQkJCGhgXsKWk5tbW4M/P6t/e+vb2DAsLAgEB18PD49TT38zL49PS387N3MjK+/j4zMrKFxYW4cXRZGRk+PHzFxUV0L282tra7uTjFxUVGhkZeXBvFxcXICAgTkBB6Nvb7+Dg9e7skYiHAAAA1L2/2tTU7OLhraGgMCsq08jHFhQUl42LCwoKw7W1BQQE8OflKyIhDgsLpJuagnp48uvpopeWdGtpt6KhqpOSwKWkt5iXrZCOBwcHjGJhgFJQfD87ejcwbTErXCgjYysmdjYujU1KpoJ/YFlYi4B/zra0nmZmfTgxVScig0A6jUE3XiwncjQtfzsyajg1mE5IoFFJpk9BikI2r1RFslZGaTIplUc6ok0/ikdAal5eGwkJgz0zfDsxqlJDkUQ5k0Q5gjsyMxYUiEA1mUg8KBEOhT00ai8pZi4oAwICdDUtBgECQx0bTiIeq1JDnUk9gElGo3Nxi1ZVxampn4B8q42JjnZz2MrJl3x59evqknp3KioqqYmFnJKQDAwMERERhYWFx3P0eAAAAP10Uk5TABA6b6nR6/v//9W8sm8W5vv7//////////9ioe3/////////////////3nkmuPn/////////V0il/////yEzh//////////nQpX///////8cjv//////dQaAif////+hLsn///8L/8P////////////////////////M///////xTf//////////mf///67////Tqv/bUv//////Hv///////7b/a//v///f///

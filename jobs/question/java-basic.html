con sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="sakura-nav-link-text &lt;lg:hidden" data-v-59573570>追番列表</span><!--[--><!--]--><!--]--></a><!--]--><!----></div><div class="sakura-dropdown sakura-navbar-link-item" aria-haspopup="true" aria-expanded="false" data-v-b00b65a0 data-v-6db7c45f data-v-ac3e8a66><!--[--><a class="va-link sakura-nav-link" title="RSS" rel="noopener" data-v-6db7c45f href="/atom.xml" target="_blank" data-v-59573570><!--[--><span class="i-ri-rss-line hvr-icon sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="&lt;lg:hidden sakura-nav-link-text" data-v-59573570>RSS</span><!--[--><!--]--><!--]--><!----></a><!--]--><!----></div><!--]--><!----></nav><!--]--><!--[--><div h-full print:op0 flex="~ center" class="sakura-navbar-tools"><button class="sakura-icon-btn sakura-toggle-dark select-none" type="button" aria-label="Toggle Color Scheme"><div class="i-line-md-moon-alt-to-sunny-outline-loop-transition"></div></button><!----><div flex="center"><button class="sakura-icon-btn sakura-search-btn" title="搜索"><div i-mdi-search></div></button><!----></div><!----><!--[--><!--]--></div><!--]--></div></header><!--]--><!--]--><main class="sakura-sidebar-offset sakura-main" data-v-1c94aaa0><!--[--><!--[--><!--[--><!--]--><!--[--><!--]--><!--[--><template><article class="markdown-body min-w-0"><!--[--><div class="max-w-none prose"><!--[--><h2 id="基本类型和包装类型" tabindex="-1">基本类型和包装类型 <a class="header-anchor" href="#基本类型和包装类型" aria-label="Permalink to &quot;基本类型和包装类型&quot;">​</a></h2><details class="details custom-block"><summary>基本类型和包装类型的种类（8 种）</summary><ul><li>基本类型：byte、short、int、long、float、double、char、boolean。</li><li>包装类型：Byte、Short、Integer、Long、Float、Double、Character、Boolean。</li></ul></details><details class="details custom-block"><summary>基本类型和包装类型的区别？</summary><ul><li>用途：除了定义一些常量和局部变量之外，在其他地方比如方法参数、对象属性中很少会使用基本类型来定义变量。并且，包装类型可用于泛型，而基本类型不可以。</li><li>存储方式：基本类型的局部变量存放在 Java 虚拟机栈中的局部变量表中，基础类型的成员变量（未被 static 修饰 ）存放在 Java 虚拟机的堆中。包装类型属于对象类型，几乎所有对象示例都存在于堆中。</li><li>占用空间：相比于包装类型（对象类型）， 基本类型占用的空间往往非常小。</li><li>默认值：成员变量包装类型不赋值就是 null ，而基本类型有默认值且不是 null。</li><li>比较方式：对于基本类型来说，== 比较的是值。对于包装数据类型来说，== 比较的是对象的内存地址。所有整型包装类对象之间值的比较，全部使用 <code>equals()</code> 方法。</li></ul></details><details class="details custom-block"><summary>浮点数运算带来的精度问题？</summary><p>浮点数运算的精度问题是由于浮点数的<strong>二进制表示</strong>方式导致的。浮点数在计算机中是以二进制的形式存储的，而二进制无法精确表示某些十进制小数，比如 0.1，会被近似表示为一个无限循环小数。</p><blockquote><p>解决方法：可以使用 BigDecimal 类来解决浮点数运算的精度问题。</p></blockquote></details><details class="details custom-block"><summary>String 为什么不可变？</summary><ul><li>由于使用 final 关键字，String 对象被设计成不可变的。</li><li>不可变的字符串有利于字符串常量池（位于方法区，存储字符串常量）的实现，提高字符串的共享性和安全性。</li></ul></details><details class="details custom-block"><summary>String，StringBuffer，StringBuilder 的区别？</summary><ul><li>String 是不可变的字符串，每次修改都会生成新的字符串对象，适用于字符串不经常变化的场景。</li><li>StringBuffer 是线程安全的可变字符串，适用于多线程场景。</li><li>StringBuilder 是非线程安全的可变字符串，适用于单线程场景。</li></ul></details><details class="details custom-block"><summary>字符串常量池拼接原理</summary><p>字符串常量池拼接原理是<strong>编译期优化</strong>，比如<code>String s1 = &quot;ab&quot;，</code>String s2 = &quot;a&quot; + &quot;b&quot;，这里的<code>s2</code>是由两个字符串常量拼接而成，在编译期语句会转换成<code>String s2 = &quot;ab&quot;</code>；换而言之，class 文件中不存在<code>&quot;a&quot;</code>和<code>&quot;b&quot;</code>（特殊情况，<code>&quot;a&quot;</code>为字面量，但是不会再次创建对象），所以<code>s1</code>和<code>s2</code>都是串池中的<code>&quot;ab&quot;</code>，表示的是同一个对象。</p></details><h2 id="面向对象" tabindex="-1">面向对象 <a class="header-anchor" href="#面向对象" aria-label="Permalink to &quot;面向对象&quot;">​</a></h2><p>面向对象（Object-Oriented Programming, OOP）是 Java 的核心编程范式，通过定义类和对象来组织程序。主要概念包括：</p><ul><li>类：描述一组具有相同属性和行为的对象的模板。</li><li>对象：类的示例，具有状态和行为。</li><li>封装：通过将数据和方法封装在类中，控制访问权限，提高安全性和可维护性。</li><li>继承：通过继承父类，子类可以重用父类的属性和方法，并且可以扩展或重写父类的方法。</li><li>多态：同一操作作用于不同对象，可以有不同的解释和执行结果（主要通过重写和重载实现）。</li></ul><details class="details custom-block"><summary>面向对象的三大特征或特点？</summary><p>封装、继承、多态。</p></details><h3 id="重载与重写" tabindex="-1">重载与重写 <a class="header-anchor" href="#重载与重写" aria-label="Permalink to &quot;重载与重写&quot;">​</a></h3><h2 id="反射" tabindex="-1">反射 <a class="header-anchor" href="#反射" aria-label="Permalink to &quot;反射&quot;">​</a></h2><h2 id="异常" tabindex="-1">异常 <a class="header-anchor" href="#异常" aria-label="Permalink to &quot;异常&quot;">​</a></h2><h2 id="jar-java-archive" tabindex="-1">JAR (Java Archive) <a class="header-anchor" href="#jar-java-archive" aria-label="Permalink to &quot;JAR (Java Archive)&quot;">​</a></h2><details class="details custom-block"><summary>打包成 jar 包之后这些依赖包的位置在哪呢，Java 是怎么识别的？</summary><p><s>在我的项目配置，项目中使用 maven 来管理依赖和打包，在编译后，会打包到<code>./target/</code>，Java 是通过 classpath 来识别依赖的。</s></p><ol><li>普通打包：<code>java -cp xxx.jar:lib/* com.example.demo.DemoApplication</code>，需要使用<code>-cp</code>指定依赖包的位置。</li><li>spring-boot-maven-plugin 打包：<code>java -jar xxx.jar</code>，spring-boot-loader 会自动识别<code>BOOT-INF/lib</code>下的依赖包。</li></ol></details><h2 id="java-版本特性" tabindex="-1">Java 版本特性 <a class="header-anchor" href="#java-版本特性" aria-label="Permalink to &quot;Java 版本特性&quot;">​</a></h2><h3 id="java-17" tabindex="-1">Java 17 <a class="header-anchor" href="#java-17" aria-label="Permalink to &quot;Java 17&quot;">​</a></h3><details class="details custom-block"><summary>你了解 Java 的 Record 类吗？它解决了什么问题？</summary><p>Record 是 Java 14 引入的预览特性，Java 17 正式发布。它是一种特殊的类，专门用来存储数据。</p><p><strong>示例代码：</strong></p><div class="language-java max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">java</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#6A737D;--shiki-dark:#6A737D;">// 传统写法（繁琐）</span></span>

i>字符串（REDIS_STRING）：适用于 缓存、计数、共享 Session、IP 统计、分布式锁等。</li><li>列表（REDIS_LIST）： 链表、消息队列、栈、有序的对象列表（如朋友圈的点赞顺序列表、评论顺序列表）。</li><li>哈希表（REDIS_HASH）： 购物车信息、用户信息、Hash 类型的 (key, field, value) 存储对象等。</li><li>集合（REDIS_SET）：无序的唯一的键值结构： 好友、关注、粉丝、感兴趣的人集合等。</li><li>有序集合（REDIS_ZSET）：访问排行榜、点赞排行、粉丝数排行等。</li></ul><figure><img src="/assets/redis-data-type.Dbr-u4uQ.png" alt="redis-data-type.png" loading="lazy" decoding="async"></figure><h4 id="常见问题" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题" aria-label="Permalink to &quot;常见问题&quot;">​</a></h4><details class="details custom-block"><summary>Redis 底层怎么实现的？</summary><p>Redis 的五种数据类型都有多种底层编码实现：</p><p>&quot;String 类型：int、embstr、raw 三种编码，根据内容和长度自动选择 Hash 类型：ziplist 和 hashtable，小数据用 ziplist 节省内存 List 类型：使用 quicklist，结合了 ziplist 和 linkedlist 的优点 Set 类型：intset 和 hashtable，整数集合用 intset 优化 ZSet 类型：ziplist 和 skiplist+hash，跳跃表支持高效范围查询 这种设计在保证功能的同时，针对不同场景进行了内存和性能优化。&quot;</p></details><ul><li>hashtable 是怎样实现的</li><li>ziplist 怎样实现的</li></ul><h3 id="io-模型" tabindex="-1">IO 模型 <a class="header-anchor" href="#io-模型" aria-label="Permalink to &quot;IO 模型&quot;">​</a></h3><h4 id="基础概念-1" tabindex="-1">基础概念 <a class="header-anchor" href="#基础概念-1" aria-label="Permalink to &quot;基础概念&quot;">​</a></h4><p>Redis 使用的是 I/O 多路复用模型，多路复用指的是：多个 socket 连接复用一个线程。这种模式下，内核不会去监视应用程序的连接，而是监视文件描述符。当客户端发起请求的时候，会生成不同事件类型的套接字。</p><p>而在服务端，因为使用了 I/O 多路复用技术，所以不是阻塞式的同步执行，而是将消息放入 socket 队列（参考下图的 I/O Multiplexing module），然后通过 File event Dispatcher 将其转发到不同的事件处理器上，如 accept、read、send。</p><div class="mermaid"></div><h3 id="持久化机制" tabindex="-1">持久化机制 <a class="header-anchor" href="#持久化机制" aria-label="Permalink to &quot;持久化机制&quot;">​</a></h3><h4 id="基础概念-2" tabindex="-1">基础概念 <a class="header-anchor" href="#基础概念-2" aria-label="Permalink to &quot;基础概念&quot;">​</a></h4><p>Redis 支持两种持久化机制：</p><p><strong>RDB（Redis DataBase）Snapshot：</strong> Redis 在指定的时间间隔内，将内存中的数据集快照定格下来，写入磁盘，并存储在副本文件中。当 Redis 重启时，这些快照文件会被自动读取并恢复到内存中。</p><ul><li>**SAVE：**阻塞式保存，Redis 会阻塞所有的请求，直到 RDB 文件生成完成。</li><li>**BGSAVE：**非阻塞式保存，Redis 会 fork 一个子进程来生成 RDB 文件，主进程继续处理请求。</li><li>优点：以二进制格式+数据压缩的方式存储数据，节省空间；恢复速度快。</li><li>缺点：无法实时持久化，每次创建子进程，频繁操作磁盘，性能开销大；数据丢失风险，如果 Redis 在 RDB 文件生成完成之前崩溃，则会丢失所有未保存的数据；无法兼容新旧版本 rdb 文件。</li></ul><p><strong>AOF（Append Only File）：</strong></p><p>以独立日志的方式存储了 Redis 服务器的顺序指令序列，并只记录对内存进行修改的指令。</p><ul><li>优点：实时持久化，数据丢失风险小；支持增量备份；可以使用 Redis 的命令行工具进行查看和编辑。</li><li>缺点：AOF 文件体积较大，恢复速度慢；性能开销大；需要定期重写 AOF 文件。</li><li>重写机制：Redis 会在后台异步重写 AOF 文件，避免阻塞主线程。重写时，Redis 会 fork 一个子进程（分配内存）创建一个新的 AOF 文件，父进程将增量命令继续写入旧的 AOF 文件和 AOF 重写缓冲区，当子进程旧的 AOF 文件重写完毕，父进程再将重写缓冲区中的增量命令追加到新的 AOF 文件中，然后将旧的 AOF 文件替换为新的 AOF 文件。</li></ul><p><strong>混合持久化：</strong> RDB + AOF，就是在 AOF 重写 时，把当前数据快照 + 后续写入命令 一起保存到 AOF 文件里。</p><h4 id="注意事项" tabindex="-1">注意事项 <a class="header-anchor" href="#注意事项" aria-label="Permalink to &quot;注意事项&quot;">​</a></h4><ul><li>重写时，当前写入命令会缓存到 auf_rewrite_buf 中，等到重写完成后，再将 auf_rewrite_buf 中的命令写入新的 AOF 文件中。</li><li>RDB 提供了快照模式，记录某个时间的 Redis 内存状态。RDB 设计了 bgsave 和写时复制，尽可能避免执行快照期间对读写指令的影响，但是频繁快照会给磁盘带来压力以及 fork 阻塞主线程。需把握频率。</li><li>AOF 日志存储了 Redis 服务的顺序指令序列，通过重放（replay）指令来写入日志文件，并通过写回策略来避免高频读写给 Redis 带来压力。</li><li>RDB 快照的照片时间间隔，必然会带来数据缺失，如果允许分钟级别的数据丢失，可以只使用 RDB。</li><li>如果只用 AOF，写回策略优先使用 everysec 的配置选项，因为它在可靠性和性能之间取了一个平衡。</li><li>数据不能丢失时，内存快照和 AOF 的混合使用是一个很好的选择。</li></ul><h4 id="常见问题-1" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-1" aria-label="Permalink to &quot;常见问题&quot;">​</a></h4><details class="details custom-block"><summary>Redis 又快有能持久化，那所有数据都放在 Redis 中可行吗？</summary><p>通常情况下，我们会选择数据库对数据进行存储（如 MySQL、PostgreSQL），因为它们支持<strong>事务、表结构约束</strong>、复杂查询等特性。Redis 尽管具备高性能和持久化能力，但并不适合替代数据库作为全量数据存储。 正常情况下，一般将 Redis 作为 缓存层 + 高频访问热数据存储，数据库作为最终的持久化存储层。 只有在对<strong>事务和一致性</strong>要求不高，且<strong>内存资源充足</strong>的业务中，才可能考虑 Redis 直接存储全量数据。</p></details><details class="details custom-block"><summary>每天增长数据百万条，还能够把数据放 Redis 中吗？</summary><p>在日新增百万级别的数据场景下，Redis 不能作为唯一存储，需要结合业务优化：</p><ul><li>可以按照业务情况设置<strong>过期时间、内存淘汰策略、分片与集群</strong>等来限制内存占用情况。</li><li>冷热分离：如果需要长期保存数据，应该将数据先写入数据库，再将部分热点数据同步到 Redis。</li></ul></details><h4 id="参考" tabindex="-1">参考 <a class="header-anchor" href="#参考" aria-label="Permalink to &quot;参考&quot;">​</a></h4><ul><li><a href="https://www.cnblogs.com/shoshana-kong/p/17519636.html" target="_blank" rel="noreferrer">Redis 的 AOF 重写机制 - 白露~ - 博客园</a></li></ul><h3 id="内存淘汰策略" tabindex="-1">内存淘汰策略 <a class="header-anchor" href="#内存淘汰策略" aria-label="Permalink to &quot;内存淘汰策略&quot;">​</a></h3><p>内存淘汰策略是解决内存过大的问题，当 Redis 内存使用超过 maxmemory 限制时，Redis 会根据配置的淘汰策略来删除一些键值对，以释放内存。</p><figure><img src="/assets/redis-memory-eviction-policy.C-s6ytnF.png" alt="redis-memory-eviction-policy" loading="lazy" decoding="async"></figure><h3 id="常见问题-2" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-2" aria-label="Permalink to &quot;常见问题&quot;">​</a></h3><ul><li>为什么购物车多读多写</li><li>集群环境下，Redis 内存里的数据怎么保证一致</li><li>如何实现 Redis 的定时机制</li></ul><details class="details custom-block"><summary>Redis 有那些客户端，有什么区别？</summary><ul><li>Jedis：是 Redis 官方推荐的 Java 客户端，基于连接池，线程安全。</li><li>Lettuce：是一个高性能的 Redis 客户端，基于 Netty，支持异步和同步操作，线程安全。</li><li>Redisson：是一个基于 Redis 的 Java 驻内存数据网格（In-Memory Data Grid）和分布式锁服务框架，提供了许多分布式对象和服务，如分布式集合、分布式对象、分布式锁、分布式服务等。</li><li>Spring Data Redis：是 Spring Data 项目的一部分，提供了对 Redis 的支持，简化了 Redis 的操作，提供了 RedisTemplate 和 StringRedisTemplate 两个模板类。</li></ul></details><details class="details custom-block"><summary>Redis 的主从复制原理？</summary><p>Redis 主从复制有全量复制和部分复制两种方式。第一次连接或主库内存丢失时，会触发全量复制，主库生成 RDB 文件并发送给从库； 断线重连时，如果 offset 在主库复制缓冲区中还能找到，就会触发部分复制，只同步这段缺失的数据，避免了大规模数据传输，提高了系统的可用性。</p></details><details class="details custom-block"><summary>Redis 的过期策略？</summary><p>Redis 的过期策略主要有三种：</p><ul><li>定时删除：Redis 会在设置过期时间时，使用定时器定期检查过期的键值对，并删除它们。</li><li>惰性删除：Redis 在访问键值对时，会检查该键值对是否过期，如果过期则删除它。</li><li>定期删除：Redis 会定期随机抽取一些键值对，检查它们是否过期，如果过期则删除它们。</li></ul><p>Redis 使用的过期删除策略是<strong>惰性删除+定期删除</strong>，删除的对象是已过期的 key。</p></details><details class="details custom-block"><summary>Redis 为什么这么快?</summary><p>Redis 之所以快，主要有以下几个原因：</p><ul><li><strong>基于内存</strong>：Redis 数据存储在内存中，读写速度快。</li><li><strong>单线程</strong>：Redis 是单线程模型，避免了多线程的频繁上下文切换。</li><li><strong>非阻塞 I/O</strong>：Redis 使用 epoll 作为 I/O 多路复用技术，非阻塞 I/O。</li><li><strong>数据结构</strong>：Redis 使用了高效的数据结构，如哈希表、跳表、链表等。</li><li><strong>持久化</strong>：Redis 支持 RDB 和 AOF 两种持久化机制，保证数据持久化。</li><li><strong>集群</strong>：Redis 支持主从复制、哨兵和集群模式，提高了可用性和扩展性。</li></ul><p>换而言之，Redis 是单线程模型，这样避免的多线程的上下文切换和锁竞争问题，同时通过非阻塞 I/O 和事件驱动模型来处理高并发请求。 另外数据存储在内存中，读写速度快，使用高效的数据结构，如哈希表、跳表、链表等，保证了数据的高效存取。</p></details><details class="details custom-block"><summary>Redis 旁路缓存（Cache Aside）和写回缓存（Write Back）的区别</summary><ul><li><strong>旁路缓存（Cache Aside）</strong>：读取数据时，先从缓存中读取，如果缓存中没有数据，再从数据库中读取，然后将数据写入缓存。更新数据时，<strong>先更新数据库，再删除缓存</strong>。</li><li><strong>写回缓存（Write Back）</strong>：读取数据时与旁路缓存一致。更新数据时，<strong>先更新缓存，再更新数据库</strong>。</li></ul></details><details class="details custom-block"><summary>redis 怎么实现分布式锁，setnx 有哪些参数？</summary><p>Redis 分布式锁 通常通过 SETNX（Set if Not Exists） 命令实现。</p><div class="language-bash max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">bash</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#6F42C1;--shiki-dark:#B392F0;">SET</span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;"> key</span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;"> value</span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;"> NX</span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;"> PX</span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;"> seconds</span></span></code></pre><button class="code-block-unfold-btn"></button></div><ul><li>key：锁的标识值</li><li>value：唯一标识，用于判断锁的归属</li><li>NX：只在键不存在时，才对键进行设置操作</li><li>PX seconds：设置键的过期时间，防止锁忘记释放</li></ul></details><details class="details custom-block"><summary>redisson 是怎么确定锁的拥有者的？</summary><ul><li>唯一标识：使用 UUID 作为 value 参数，设置唯一标识，用于判断锁的归属。</li><li>看门狗机制：leaseTime 没有设置时，Redisson 会使用 30 秒作为默认的 leaseTime，同时启动一个看门狗线程，每隔 10 秒续期一次，避免锁过期。</li><li>可重入锁：同一线程多次加锁时，Redisson 会维护一个锁的重入计数器，避免阻塞。</li></ul></details><h2 id="缓存" tabindex="-1">缓存 <a class="header-anchor" href="#缓存" aria-label="Permalink to &quot;缓存&quot;">​</a></h2><details class="details custom-block"><summary>缓存预热是什么</summary><p>答：缓存预热是在业务刚上线的时候，我们最好提前把数据缓起来，而不是等待用户访问才来触发缓存构建，可采用后台更新机制。</p></details><details class="details custom-block"><summary>超卖问题是什么，应该怎么解决？</summary><p>以证券交易系统为例</p><div class="mermaid"></div><hr><ul><li>超卖问题：在高并发交易场景下，撮合系统没有正确更新和同步库存数据，导致同一批股票被多次卖出。</li><li>根本原因： <ul><li><strong>并发问题</strong>：多个线程同时读取库存数据，判断库存充足后，同时更新库存。</li><li><strong>缓存问题</strong>：缓存和数据库数据不一致，缓存数据未正确更新。</li><li><strong>事务问题</strong>：事务未正确提交或回滚，导致库存数据未正确更新。</li><li><strong>撮合引擎问题</strong>：撮合引擎处理顺序错误。</li></ul></li><li>解决方案： <ul><li><strong>悲观锁</strong>：在更新库存时加锁，保证同一时间只有一个线程更新库存。</li><li><strong>乐观锁</strong>：在更新库存时，先查询库存，再更新库存，保证库存不为负数。</li><li><strong>消息队列</strong>：将用户的购买请求放入消息队列，异步处理，保证库存不为负数。</li><li><strong>冻结库存</strong>：在用户下单时，先冻结库存，等订单撮合成功后再扣减库存。</li></ul></li></ul></details><ul><li>内存泄露具体发生在哪</li><li>栈内存泄漏和堆内存泄漏的区别</li></ul><h2 id="缓存三剑客" tabindex="-1">缓存三剑客 <a class="header-anchor" href="#缓存三剑客" aria-label="Permalink to &quot;缓存三剑客&quot;">​</a></h2><h3 id="缓存穿透" tabindex="-1">缓存穿透 <a class="header-anchor" href="#缓存穿透" aria-label="Permalink to &quot;缓存穿透&quot;">​</a></h3><ul><li>现象：请求访问缓存和数据库中都不存在的 key，每次请求都会直接达到数据库，导致数据库压力激增</li><li>解决方案： <ul><li>布隆过滤器：将所有可能存在的数据哈希到一个足够大的 bitmap 中，一个一定不存在的数据会被这个 bitmap 拦截掉</li><li>空值过滤：缓存层增加一个空值的标记，当存储层没有数据时，缓存层也会将这个空值标记存入缓存，但是会设置一个较短的过期时间（TTL）</li><li>限流保护：对异常频繁的请求进行 IP 或验证码的验证</li></ul></li></ul><h3 id="缓存击穿" tabindex="-1">缓存击穿 <a class="header-anchor" href="#缓存击穿" aria-label="Permalink to &quot;缓存击穿&quot;">​</a></h3><ul><li>现象：某个热点 key 过期，大量并发请求同时访问数据库，导致数据库瞬间承受高负载</li><li>解决方案： <ul><li>互斥锁：保证同一时间只有一个业务线程更新缓存，未能获取互斥锁的请求，要么等待锁释放后重新读取缓存，要么直接返回空值或默认值</li><li>后台更新缓存：不给热点数据设置过期时间，由后台线程异步更新缓存，或者在在热点数据准备要过期前，提前通知后台线程更新缓存以及设置过期时间</li></ul></li></ul><h3 id="缓存雪崩" tabindex="-1">缓存雪崩 <a class="header-anchor" href="#缓存雪崩" aria-label="Permalink to &quot;缓存雪崩&quot;">​</a></h3><ul><li>现象：缓存层的大量数据同时过期，导致请求直接访问数据库，数据库压力激增</li><li>解决方案： <ul><li>缓存集群+数据库集群：通过多台机器部署缓存和数据库，提高系统的容错性</li><li>随机过期时间：缓存数据的过期时间设置随机值，防止同一时间大量数据过期现象</li><li>互斥锁：锁住更新缓存的资源，保证只有一个线程去更新缓存，并设置锁的超时时间</li><li>后台更新缓存（缓存预热）：业务线程不负责更新缓存，而是由后台线程负责定时更新缓存，或者在业务线程发现缓存过期时异步更新缓存</li></ul></li></ul><h3 id="常见问题-3" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-3" aria-label="Permalink to &quot;常见问题&quot;">​</a></h3><details class="details custom-block"><summary>没获取到锁的线程怎么处理？</summary><ol><li>重试机制，等待一段时间后再次尝试获取锁，或使用指数退避算法</li><li>直接抛出异常提示用户稍后再试</li><li>如果缓存中有逻辑过期时间，可以在锁争抢失败时直接返回过期数据，同时后台异步更新</li></ol></details><h3 id="小结" tabindex="-1">小结 <a class="header-anchor" href="#小结" aria-label="Permalink to &quot;小结&quot;">​</a></h3><figure><img src="/assets/redis-caching.qNiYolNW.png" alt="redis-caching.png" loading="lazy" decoding="async"></figure><h3 id="参考-1" tabindex="-1">参考 <a class="header-anchor" href="#参考-1" aria-label="Permalink to &quot;参考&quot;">​</a></h3><ul><li><a href="https://www.cnblogs.com/wzh2010/p/13874211.html" target="_blank" rel="noreferrer">架构与思维：一次缓存雪崩的灾难复盘</a></li></ul><h2 id="缓存策略" tabindex="-1">缓存策略 <a class="header-anchor" href="#缓存策略" aria-label="Permalink to &quot;缓存策略&quot;">​</a></h2><h3 id="旁路缓存-cache-aside" tabindex="-1">旁路缓存（Cache Aside） <a class="header-anchor" href="#旁路缓存-cache-aside" aria-label="Permalink to &quot;旁路缓存（Cache Aside）&quot;">​</a></h3><ul><li><strong>读取数据</strong>：先从缓存中读取，如果缓存中没有数据，再从数据库中读取，然后将数据写入缓存</li><li><strong>更新数据</strong>：先更新数据库，再同步更新或删除缓存</li></ul><h3 id="更新数据库-更新缓存" tabindex="-1">更新数据库+更新缓存 <a class="header-anchor" href="#更新数据库-更新缓存" aria-label="Permalink to &quot;更新数据库+更新缓存&quot;">​</a></h3><ul><li><strong>先更新数据库，再更新缓存</strong>和<strong>先更新缓存，再更新数据库</strong>：都存在并发问题，当两个请求并发更新同一条数据时，可能会出现缓存和数据库数据不一致的情况</li><li>解决方案： <ul><li>分布式锁：保证同一时间只有一个线程更新缓存，其他线程等待锁释放后再更新缓存</li><li>TTL：设置缓存的过期时间，保证缓存数据在一定时间内有效，过期后再更新缓存</li></ul></li></ul><h3 id="更新数据库-删除缓存" tabindex="-1">更新数据库+删除缓存 <a class="header-anchor" href="#更新数据库-删除缓存" aria-label="Permalink to &quot;更新数据库+删除缓存&quot;">​</a></h3><ul><li><strong>先删除缓存，在更新数据库</strong>：读策略和写策略并发时，可能会出现缓存和数据库数据不一致的情况</li><li>解决方案： <ul><li>延迟双删：设置一个延迟时间，再次删除缓存，保证缓存和数据库数据一致</li></ul></li><li><strong>先更新数据库，再删除缓存</strong>：读策略和写策略并发时，不会出现缓存和数据库数据不一致的情况，因为<strong>缓存的写入远远快于数据库的写入</strong>；但是会出现删除缓存失败的情况</li><li>解决方案： <ul><li>消息队列重试机制：消息队列来重试缓存的删除，优点是保证缓存一致性的问题，缺点会对业务代码入侵</li><li>订阅 MySQL binlog，再操作缓存：订阅 MySQL binlog + 消息队列 + 重试缓存的删除，优点是规避了代码入侵问题，也很好的保证缓存一致性的问题，缺点就是引入的组件比较多，对团队的运维能力比较有高要求</li></ul></li></ul><h3 id="参考-2" tabindex="-1">参考 <a class="header-anchor" href="#参考-2" aria-label="Permalink to &quot;参考&quot;">​</a></h3><ul><li><a href="https://www.cnblogs.com/wzh2010/p/17205453.html" target="_blank" rel="noreferrer">Redis 系列 21：缓存与数据库的数据一致性讨论</a></li></ul><!--]--></div><!--[--><!--]--><!--[--><!--]--><!--]--><!----><!----></article></template><!--]--><!--[--><!--]--><!--[--><!--]--><!--[--><!--]--><!----><!--[--><!--]--><!--]--><!--]--></main><!--[--><div data-v-1c94aaa0 style="display:none;" data-v-a46f6f61><div data-v-a46f6f61></div><img class="sakura-to-top-node" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEYAAABmCAMAAABBXBeAAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAvdQTFRFAAAAAAAAAgICAwMDDQsLDg0NCgkJAwICAAAACAcHBwYGFRISQyMecTYtAQAADAsLEQ8PNzU1WVVUaGhob29vdHR0bWpqVVBPJSQkERAQBgUFGBYWEBAQDQsLSkpKkZGRzMzM5OPk9PPz/////fv76enpzs7OpaWlZWVlMjAwExISDg0NAwEBHh4eBQUFBAQESEVEqKio9vb2//7+2dnZYGBgBAQEAgICDgoKKigoh4eH1tXV4ODgAQEBBgICGxkaOTk57e3t+Pj4/v39tLS0xsbGQD4+FBMTCAgIGxISGxgYq6ur/Pr63NzcoaGhmZmZAAAAEg8Pv7+/0tLSlJSUjY2NFRQUFBQUAwAADQwMLx8fISAg8fHxubm5iYmJSC8uBQUFDgwM6+vrenp6g4KCBAEBr6+vFhUVwbKy5+fnnZ2dHRwcybu65tjY6t3c8eno+PT0XFxct6mp5NbV4dPR4dHQ6NnZ9vDwYmJiQkJCGhgXsKWk5tbW4M/P6t/e+vb2DAsLAgEB18PD49TT38zL49PS387N3MjK+/j4zMrKFxYW4cXRZGRk+PHzFxUV0L282tra7uTjFxUVGhkZeXBvFxcXICAgTkBB6Nvb7+Dg9e7skYiHAAAA1L2/2tTU7OLhraGgMCsq08jHFhQUl42LCwoKw7W1BQQE8OflKyIhDgsLpJuagnp48uvpopeWdGtpt6KhqpOSwKWkt5iXrZCOBwc

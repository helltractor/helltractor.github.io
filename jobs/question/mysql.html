con sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="sakura-nav-link-text &lt;lg:hidden" data-v-59573570>追番列表</span><!--[--><!--]--><!--]--></a><!--]--><!----></div><div class="sakura-dropdown sakura-navbar-link-item" aria-haspopup="true" aria-expanded="false" data-v-b00b65a0 data-v-6db7c45f data-v-ac3e8a66><!--[--><a class="va-link sakura-nav-link" title="RSS" rel="noopener" data-v-6db7c45f href="/atom.xml" target="_blank" data-v-59573570><!--[--><span class="i-ri-rss-line hvr-icon sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="&lt;lg:hidden sakura-nav-link-text" data-v-59573570>RSS</span><!--[--><!--]--><!--]--><!----></a><!--]--><!----></div><!--]--><!----></nav><!--]--><!--[--><div h-full print:op0 flex="~ center" class="sakura-navbar-tools"><button class="sakura-icon-btn sakura-toggle-dark select-none" type="button" aria-label="Toggle Color Scheme"><div class="i-line-md-moon-alt-to-sunny-outline-loop-transition"></div></button><!----><div flex="center"><button class="sakura-icon-btn sakura-search-btn" title="搜索"><div i-mdi-search></div></button><!----></div><!----><!--[--><!--]--></div><!--]--></div></header><!--]--><!--]--><main class="sakura-sidebar-offset sakura-main" data-v-1c94aaa0><!--[--><!--[--><!--[--><!--]--><!--[--><!--]--><!--[--><template><article class="markdown-body min-w-0"><!--[--><div class="max-w-none prose"><!--[--><h2 id="体系框架" tabindex="-1">体系框架 <a class="header-anchor" href="#体系框架" aria-label="Permalink to &quot;体系框架&quot;">​</a></h2><div class="mermaid"></div><h3 id="常见问题" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题" aria-label="Permalink to &quot;常见问题&quot;">​</a></h3><details class="details custom-block"><summary>MySQL 可以不指定主键建表吗，背后的逻辑是什么？</summary><p><strong>可以不指定主键</strong>，但是 MySQL（尤其是 <strong>InnoDB 存储引擎</strong>）在底层仍然需要一个主键来组织数据。</p><ul><li><strong>逻辑机制</strong>： <ul><li>InnoDB 是 <strong>基于 B+ 树的聚簇索引</strong> 存储引擎，表数据按照主键顺序组织存储。</li><li>如果用户没有显式定义主键： <ol><li>优先选择一个 <strong>第一个非空的唯一索引</strong> 列作为聚簇索引。</li><li>如果没有唯一索引，InnoDB 会 <strong>隐式生成一个 6 字节的自增 RowID</strong> 作为主键。</li></ol></li></ul></li><li><strong>注意</strong>： <ul><li>这个隐藏的主键用户看不到，但在存储和查询优化过程中会被使用。</li><li>显式定义主键一般是最佳实践，方便维护和调优。</li></ul></li></ul></details><details class="details custom-block"><summary>建立唯一索引，插入数据时是怎么处理的?</summary><p>当表上有<strong>唯一索引</strong>时，插入数据会触发唯一性检查：</p><ul><li>MySQL 会先通过<strong>唯一索引 B+树</strong>查找是否已存在相同 key 值；</li><li>如果不存在重复 key 值：将新纪录插入到 B+树中；</li><li>如何存在重复 key 值： <ul><li>默认 SQL 模式下（如 <code>STRICT_TRANS_TABLES</code>），会直接抛出<code>Duplicate entry &#39;...&#39; for key &#39;...&#39;</code>错误；</li><li>如果启用<code>INSERT IGNORE</code>，重复数据会被忽略，不报错；</li><li>如果启用<code>REPLACE INTO</code>，会先删除原有记录，在插入新记录；</li></ul></li></ul></details><details class="details custom-block"><summary>重复插入会报错，是怎么处理的?</summary><ol><li><p>直接报错，不进行处理</p><div class="language-sql max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">sql</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">INSERT INTO</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> user(id, </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">message</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">) </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">VALUES</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> (</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;">1</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">, </span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;">&#39;test1&#39;</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">);  </span><span style="--shiki-light:#6A737D;--shiki-dark:#6A737D;">-- 首次成功</span></span>
<span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">INSERT INTO</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> user(id, </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">message</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">) </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">VALUES</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> (</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;">1</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">, </span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;">&#39;test2&#39;</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">);  </span><span style="--shiki-light:#6A737D;--shiki-dark:#6A737D;">-- 1062 Duplicate entry</span></span></code></pre><button class="code-block-unfold-btn"></button></div></li><li><p>忽略冲突，不报错，返回警告</p><div class="language-sql max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">sql</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">INSERT IGNORE INTO</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> user(id, </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">message</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">) </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">VALUES</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> (</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;">1</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">, </span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;">&#39;test1&#39;</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">);  </span><span style="--shiki-light:#6A737D;--shiki-dark:#6A737D;">-- 被忽略</span></span>
<span class="line"><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">SHOW WARNINGS; </span><span style="--shiki-light:#6A737D;--shiki-dark:#6A737D;">-- 可查看被忽略原因</span></span></code></pre><button class="code-block-unfold-btn"></button></div></li><li><p>出现冲突则更新，<code>UPDATE</code></p><div class="language-sql max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">sql</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">INSERT INTO</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> user(id, </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">message</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">) </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">VALUES</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> (</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;">1</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">, </span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;">&#39;test1&#39;</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">)</span></span>
<span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">ON</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> DUPLICATE </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">KEY</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> UPDATE</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> message</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> =</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> VALUES</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">(</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">message</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">)</span></span></code></pre><button class="code-block-unfold-btn"></button></div><ul><li><p><strong>MySQL 8.0.19+</strong> 推荐写法（避免 <code>VALUES()</code> 弃用告警）：</p><div class="language-sql max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">sql</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">INSERT INTO</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> user(id, </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">message</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">) </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">VALUES</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> (</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;">1</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">, </span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;">&#39;test1&#39;</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">) </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">AS</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> new</span></span>
<span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">ON</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> DUPLICATE </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">KEY</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> UPDATE</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> message</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> =</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;"> new</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">.</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;">message</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">;</span></span></code></pre><button class="code-block-unfold-btn"></button></div></li></ul></li><li><p>先删后插，<code>REPLACE INTO</code></p><div class="language-sql max-h-300px"><button title="Copy code" class="copy"></button><span class="lang">sql</span><pre class="shiki shiki-themes github-light github-dark vp-code"><code v-pre><span class="line"><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">REPLACE</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> INTO</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> user(id, </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">message</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">) </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">VALUES</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;"> (</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;">1</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">, </span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF;">&#39;test1&#39;</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">);</span></span></code></pre><button class="code-block-unfold-btn"></button></div></li></ol></details><h2 id="索引" tabindex="-1">索引 <a class="header-anchor" href="#索引" aria-label="Permalink to &quot;索引&quot;">​</a></h2><h3 id="数据结构" tabindex="-1">数据结构 <a class="header-anchor" href="#数据结构" aria-label="Permalink to &quot;数据结构&quot;">​</a></h3><p>常见的索引数据结构包括： Hash 表、二叉查找树（BST）、平衡二叉查找树（AVL）、红黑树、B 树 和 B+ 树等。</p><p>目前大部分数据库系统及文件系统都采用 B-Tree 或其变种 B+Tree 作为索引结构。</p><h4 id="常见问题-1" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-1" aria-label="Permalink to &quot;常见问题&quot;">​</a></h4><details class="details custom-block"><summary>B 树和 B+树两者有何异同呢？使用 B+树的好处？</summary><p>B 树和 B+ 树都是多路平衡查找树，即每个节点有多个子节点。B 树和 B+ 树的区别主要在于：</p><ul><li>B 树的所以节点存储键值，B+树的非叶子节点只存储键，只有叶子节点存储键值。</li><li>B 树的叶子节点相互独立，B+树的叶子节点有一条引用链指向与它相邻的叶子节点。</li><li>B 树的检索是范围内的每个节点做二分查找，可能无需遍历到叶子节点，B+树的检索是范围内的每个节点都要遍历到叶子节点。</li><li>B 树的范围查询，首先找到要查找的下限，然后进行中序遍历，直到找到上限；B+树的范围查询，只需对叶子节点进行遍历。</li></ul><p>综上，B+ 树的优点在于，具有更少的 IO 次数，更稳定的查询效率，更适合范围查询。</p></details><h3 id="常见问题-2" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-2" aria-label="Permalink to &quot;常见问题&quot;">​</a></h3><details class="details custom-block"><summary>索引的优缺点</summary><ul><li>优点： <ul><li>大大加快数据的检索速度（减少检索的数据量），减少磁盘 I/O 次数。</li><li>通过创建唯一性索引，可以保证数据库表中每一行数据的唯一性。</li></ul></li><li>缺点： <ul><li>创建索引和维护索引要耗费时间，降低数据的维护速度。</li><li>索引需要占用物理空间，降低数据存储量。</li></ul></li></ul></details><details class="details custom-block"><summary>什么是聚簇索引和非聚簇索引（底层存储方式）？</summary><ul><li><strong>聚簇索引（聚集索引）：</strong> 索引结构和数据一起存放的索引，InnoDB 中的主键索引就属于聚簇索引。准确来说，是将数据存储在叶子节点中。</li><li><strong>非聚簇索引（非聚集索引）：</strong> 索引结构和数据分开存放的索引，二级索引(辅助索引)就属于非聚簇索引。MySQL 的 MyISAM 引擎，不管主键还是非主键，使用的都是非聚簇索引。在叶子节点中存储叶子节点本身的索引值和主键值（MyISAM 中存放是数据的地址值），有了主键值再进行一次回表操作，从聚簇索引中根据主键值定位数据位置。</li></ul></details><details class="details custom-block"><summary>什么是覆盖索引和联合索引？</summary><ul><li><strong>覆盖索引：</strong> 覆盖索引即需要查询的字段正好是索引的字段，那么直接根据该索引，就可以查到数据了，而无需回表查询。</li><li><strong>组合索引（复合索引）</strong> 使用表中的多个字段创建索引，就是 联合索引，也叫 组合索引 或 复合索引。</li></ul><hr><p>在 InnoDB 存储引擎中，非主键索引的叶子节点包含的是主键的值。这意味着，当使用非主键索引进行查询时， 数据库会先找到对应的主键值，然后再通过主键索引来定位和检索完整的行数据。这个过程被称为“回表”。</p></details><details class="details custom-block"><summary>什么是最左前缀匹配原则?</summary><p>最左前缀匹配原则指的是在使用联合索引时，MySQL 会根据索引中的字段顺序，从左到右依次匹配查询条件中的字段。</p><p>如果查询条件与索引中的最左侧字段相匹配，那么 MySQL 就会使用索引来过滤数据，这样可以提高查询效率。</p><p>最左匹配原则会一直向右匹配，直到遇到范围查询（如 &gt;、&lt;）为止。对于 &gt;=、&lt;=、BETWEEN 以及前缀匹配 LIKE 的范围查询，不会停止匹配。</p></details><details class="details custom-block"><summary>那些情况适合创建索引的？</summary><ul><li><strong>不为 NULL 的字段：</strong> 索引字段的数据应该尽量不为 NULL，因为对于数据为 NULL 的字段，数据库较难优化。 如果字段频繁被查询，但又避免不了为 NULL，建议使用 0,1,true,false 这样语义较为清晰的短值或短字符作为替代。</li><li><strong>被频繁查询的字段：</strong> 我们创建索引的字段应该是查询操作非常频繁的字段。</li><li><strong>被作为条件查询的字段：</strong> 被作为 WHERE 条件查询的字段，应该被考虑建立索引。</li><li><strong>频繁需要排序的字段：</strong> 索引已经排序，这样查询可以利用索引的排序，加快排序查询时间。</li><li><strong>被经常频繁用于连接的字段：</strong> 经常用于连接的字段可能是一些外键列，对于外键列并不一定要建立外键，只是说该列涉及到表与表的关系。对于频繁被连接查询的字段，可以考虑建立索引，提高多表连接查询的效率。</li></ul></details><h2 id="事务" tabindex="-1">事务 <a class="header-anchor" href="#事务" aria-label="Permalink to &quot;事务&quot;">​</a></h2><h3 id="事务特性" tabindex="-1">事务特性 <a class="header-anchor" href="#事务特性" aria-label="Permalink to &quot;事务特性&quot;">​</a></h3><p>事务是一组操作的集合，要么全部执行成功，要么全部回滚。事务的 ACID 特性包括：</p><ul><li>原子性（Atomicity）：事务是最小的执行单位，不允许分割。事务的原子性确保动作要么全部完成，要么完全不起作用；</li><li>一致性（Consistency）：执行事务前后，数据保持一致，例如转账业务中，无论事务是否成功，转账者和收款人的总额应该是不变的；</li><li>隔离性（Isolation）：并发访问数据库时，一个用户的事务不被其他事务所干扰，各并发事务之间数据库是独立的；</li><li>持久性（Durability）：一个事务被提交之后。它对数据库中数据的改变是持久的，即使数据库发生故障也不应该对其有任何影响。</li></ul><div class="mermaid"></div><h3 id="事务隔离级别" tabindex="-1">事务隔离级别 <a class="header-anchor" href="#事务隔离级别" aria-label="Permalink to &quot;事务隔离级别&quot;">​</a></h3><p>SQL 标准定义了四种事务隔离级别，不同的隔离级别对并发事务的影响不同，包括：</p><ul><li><strong>读未提交（Read Uncommitted，RU）</strong>：允许脏读，一个事务可以读取到另一个事务未提交的数据。</li><li><strong>读已提交（Read Committed，RC）</strong>：只能读取到已提交的数据，避免脏读，但可能出现不可重复读。</li><li><strong>可重复读（Repeatable Read，RR）</strong>：保证同一事务中多次读取的数据是一致的，除非数据是被本身事务自己修改的。</li><li><strong>串行化（Serializable）</strong>：最高隔离级别，保证事务执行的效果与<strong>串行执行所有事务</strong>相同，避免脏读、不可重复读和幻读。</li></ul><table><thead><tr><th style="text-align:left;">隔离级别</th><th style="text-align:left;">脏读</th><th style="text-align:left;">不可重复读</th><th style="text-align:left;">幻读</th></tr></thead><tbody><tr><td style="text-align:left;">读未提交</td><td style="text-align:left;">✅</td><td style="text-align:left;">✅</td><td style="text-align:left;">✅</td></tr><tr><td style="text-align:left;">读已提交</td><td style="text-align:left;">❌</td><td style="text-align:left;">✅</td><td style="text-align:left;">✅</td></tr><tr><td style="text-align:left;">可重复读</td><td style="text-align:left;">❌</td><td style="text-align:left;">❌</td><td style="text-align:left;">✅</td></tr><tr><td style="text-align:left;">串行化</td><td style="text-align:left;">❌</td><td style="text-align:left;">❌</td><td style="text-align:left;">❌</td></tr></tbody></table><h3 id="常见问题-3" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-3" aria-label="Permalink to &quot;常见问题&quot;">​</a></h3><details class="details custom-block"><summary>并发事务可能出现的问题?</summary><ul><li>脏读：读取到未提交的数据。</li><li>不可重复读：多次读取数据，但在读取过程中，另一个事务修改了数据，导致多次读取的数据不一致。</li><li>幻读：多次读取数据，但在读取过程中，另一个事务插入或删除了数据，导致多次读取的查询数据总量不一致。</li><li><s>丢失修改：两个事务同时读取同一数据，其中一个事务修改了数据，另一个事务也修改了数据，导致其中一个事务的修改被覆盖。</s></li></ul></details><details class="details custom-block"><summary>不可重复读和幻读的区别？</summary><p>不可重复读是读取了其他事务更改的数据，针对<strong>update</strong>操作。使用行级锁，锁定该行，事务 A 多次读取操作完成后才释放该锁，这个时候才允许其他事务更改刚才的数据。</p><p>幻读是读取了其他事务增删的数据，针对<strong>insert</strong>与<strong>delete</strong>操作。使用表级锁，锁定整张表，事务 A 多次读取数据总量之后才释放该锁，这个时候才允许其他事务新增数据。</p></details><details class="details custom-block"><summary>解决幻读的方法</summary><ul><li>升级事务隔离级别：将隔离级别升级到 Serializable，保证事务串行执行，避免幻读。</li><li>使用锁机制：Next-Key Lock，保证不会出现幻读。</li></ul><hr><p>MySQL InnoDB 存储引擎默认的隔离级别是可重复读（Repeatable Read）。采用以下方式解决幻读问题的发生：</p><ul><li>快照读：在可重复读隔离级别下，通过 MVCC 机制，读取到的是快照数据，不会受到其他事务的影响。</li><li>当前读：使用 Next-Key Lock 进行加锁来保证不出现幻读，Next-Key Lock 是行记录锁（Record Lock）和间隙锁（Gap Lock）的结合，行锁只能锁住已经存在的行，为了避免插入新行，需要依赖间隙锁。</li></ul></details><h2 id="锁机制" tabindex="-1">锁机制 <a class="header-anchor" href="#锁机制" aria-label="Permalink to &quot;锁机制&quot;">​</a></h2><h3 id="锁的粒度" tabindex="-1">锁的粒度 <a class="header-anchor" href="#锁的粒度" aria-label="Permalink to &quot;锁的粒度&quot;">​</a></h3><ul><li>行锁 <ul><li>记录锁（Record Lock）：属于单个行记录上的锁。</li><li>间隙锁（Gap Lock）：锁定一个范围，不包括记录本身。</li><li>临键锁（Next-Key Lock）：Record Lock+Gap Lock，锁定一个范围，包含记录本身，主要目的是为了解决幻读问题（MySQL 事务部分提到过）。记录锁只能锁住已经存在的记录，为了避免插入新记录，需要依赖间隙锁。</li></ul></li><li>表锁</li><li>页锁：锁定数据页</li></ul><h3 id="锁的类型" tabindex="-1">锁的类型 <a class="header-anchor" href="#锁的类型" aria-label="Permalink to &quot;锁的类型&quot;">​</a></h3><ul><li>共享锁（S 锁）：又称读锁，事务在读取记录的时候获取共享锁，允许多个事务同时获取（锁兼容）。</li><li>排他锁（X 锁）：又称写锁/独占锁，事务在修改记录的时候获取排他锁，不允许多个事务同时获取。如果一个记录已经被加了排他锁，那其他事务不能再对这条事务加任何类型的锁（锁不兼容）。</li><li>意向锁（表锁） <ul><li>意向共享锁（Intention Shared Lock，IS 锁）：事务有意向对表中的某些记录加共享锁（S 锁），加共享锁前必须先取得该表的 IS 锁。</li><li>意向排他锁（Intention Exclusive Lock，IX 锁）：事务有意向对表中的某些记录加排他锁（X 锁），加排他锁之前必须先取得该表的 IX 锁。</li></ul></li></ul><h3 id="常见问题-4" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-4" aria-label="Permalink to &quot;常见问题&quot;">​</a></h3><details class="details custom-block"><summary>什么是死锁？如何避免死锁？</summary><p>死锁是指两个或两个以上的事务之间互相等待对方具有的锁，同时持有对方需要的锁。</p><ul><li>避免死锁 <ul><li>控制资源获取顺序：事务按照一定顺序获取一系列锁，获取不到释放当前占有的锁。</li><li>控制锁的粒度或少用锁：通过将隔离等级从 RR 更改为 RC，避免间隙锁和 next-key 锁带来的死锁情况。</li><li>减少持有资源的时间：事务具有长时间锁的需求，可以将 SQL 语句集中在事务的最前面或最后面。</li></ul></li><li>解决死锁 <ul><li>目前的数据库都一般都具备自动干预死锁的能力。比如 mysql 中可以通过同等待图机制检测到死锁后选择回滚一个开销较小的事务来解决死锁; 还可以通过设置一个事务的超时时间来避免死锁；</li></ul></li></ul></details><h2 id="mvcc-multi-version-concurrency-control" tabindex="-1">MVCC (Multi-Version Concurrency Control) <a class="header-anchor" href="#mvcc-multi-version-concurrency-control" aria-label="Permalink to &quot;MVCC (Multi-Version Concurrency Control)&quot;">​</a></h2><p>多版本并发控制（MVCC）通过保存数据的多个版本来实现并发控制，避免了读写冲突。</p><p>MVCC 只在 Read Committed 和 Repeatable Read 两个隔离级别下工作，其他两个隔离级别和 MVCC 不兼容：</p><ul><li>Read Uncommitted 总是读取最新的记录行，不需要 MVCC 的支持；</li><li>Serializable 则会对所有读取的记录行都加锁，单靠 MVCC 无法完成;</li></ul><h3 id="实现方式" tabindex="-1">实现方式 <a class="header-anchor" href="#实现方式" aria-label="Permalink to &quot;实现方式&quot;">​</a></h3><p>MVCC 的实现依赖于：隐藏字段、Read View、undo log。 在内部实现中，InnoDB 通过数据行的 DB_TRX_ID 和 Read View 来判断数据的可见性， 如不可见，则通过数据行的 DB_ROLL_PTR 找到 undo log 中的历史版本。 每个事务读到的数据版本可能是不一样的，在同一个事务中，用户只能看到该事务创建 Read View 之前已经提交的修改和该事务本身做的修改。</p><ul><li>隐藏字段： <ul><li>DB_TRX_ID：表示该行记录的创建或修改事务的 ID。</li><li>DB_ROLL_PTR：表示该行记录的回滚指针，指向 undo log 中的历史版本。</li><li>DB_ROW_ID：表示该行记录的唯一 ID。</li></ul></li><li>Read View：在某一时刻给事务系统的 trx_sys 打 snapshot，把当时 trx_sys 状态（包括活跃读写事务数组）记下来，之后的所有读操作根据其事务 ID（即 trx_id）与 snapshot 中的 trx_sys 的状态作比较，以此判断 read view 对于事务的可见性。</li></ul><h3 id="常见问题-5" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-5" aria-label="Permalink to &quot;常见问题&quot;">​</a></h3><details class="details custom-block"><summary>快照读与当前读的区别？</summary><p>快照读：<strong>读取的是记录的可见版本（可能是历史版本），不加锁。</strong> MySQL 中 InnoDB 存储引擎的快照读(Snapshot Read)是一种读取数据的方式，它可以在事务开始时创建一个数据快照，这个快照是一致性的，即读取在事务开始时或特定时间点之前提交的数据。 其实就是简单的 select 操作。如：<code>select * from table where ?;</code></p><p>当前读：<strong>读取的是记录的最新版本，并且当前读返回的记录都会加上锁，保证其他事务不会再并发修改这条记录。</strong> 其实就是特殊的读操作，比如插入、更新、删除属于当前读，需要加锁的也属于当前读。如：</p><ul><li>共享锁：<code>select * from table where ? lock in share mode;</code></li><li>排他锁：<code>select * from table where ? for update;</code></li><li>插入：<code>insert into table values(?);</code></li><li>更新：<code>update table set ? where ?;</code></li><li>删除：<code>delete from table where ?;</code></li></ul></details><details class="details custom-block"><summary>RR 和 RC 下快照读的区别？</summary><p>事务总能够读取到自己写入(update /insert /delete)的行记录。而其他事务的提交，则分情况。 RC 模式，快照读总是能读到最新的行数据快照，当然，必须是已提交事务写入的。 RR 模式，某个事务首次 read 记录的时间为 T1，之后的操作不会读取到 T1 时间之后已提交事务写入的记录，以保证连续相同的 read 读到相同的结果集。 简单点说：</p><ul><li>RR 下，事务在第一个 Read 操作时，会建立 Read View，并贯穿整个事务的过程，保证了可重复读的效果。</li><li>RC 下，事务在每次 Read 操作时，都会建立 Read View，以保证获取到的都是数据库中最新的被 Commit 的值。</li></ul></details><h2 id="日志" tabindex="-1">日志 <a class="header-anchor" href="#日志" aria-label="Permalink to &quot;日志&quot;">​</a></h2><p>MySQL 日志 主要包括错误日志、查询日志、慢查询日志、事务日志、二进制日志几大类。其中，比较重要的还要属二进制日志 binlog（归档日志）和事务日志 redo log（重做日志）和 undo log（回滚日志）。</p><h3 id="redo-log" tabindex="-1">redo log <a class="header-anchor" href="#redo-log" aria-label="Permalink to &quot;redo log&quot;">​</a></h3><ul><li>redo log 属于物理日志。</li><li>redo log 是 InnoDB 存储引擎独有的，让 MySQL 拥有恢复崩溃的能力，保证数据的持久性。</li><li>写入机制：当对表数据进行更新时，首先查找 buffer pool，没有命中则从硬盘中以数据页的形式读取。事务执行时，redo log 通过记录“在某个数据页上做了什么修改”，写入 redo log buffer，事务提交时，判断是否刷盘到硬盘中的 redo.file。</li><li>存储形式：日志文件组，环形数组。</li></ul><h3 id="binlog" tabindex="-1">binlog <a class="header-anchor" href="#binlog" aria-label="Permalink to &quot;binlog&quot;">​</a></h3><ul><li>binlog 属于逻辑日志。</li><li>binlog 会记录所有涉及更新数据的逻辑操作，并且是顺序写。保证了 MySQL 集群架构的数据一致性。</li><li>写入机制：事务执行时，将 binlog 写入 binlog cache，事务提交时，判断是否刷盘到硬盘中的 binlog 文件中。</li><li>存储形式 <ul><li>statement：具体 SQL 语句；</li><li>row：具体 SQL 语句+具体数据；</li><li>mixed：MySQL 会判断这条 SQL 语句是否可能引起数据不一致，如果是，就用 row 格式，否则就用 statement 格式。</li></ul></li></ul><h3 id="undo-log" tabindex="-1">undo log <a class="header-anchor" href="#undo-log" aria-label="Permalink to &quot;undo log&quot;">​</a></h3><ul><li>undo log 属于逻辑日志。</li><li>undo log 保证事务原子性。</li><li>存储形式：undo log 记录的时 SQL 语句，是已经执行的语句对应的回溯语句。undo log 信息会记录再 redo log 中，因为 undo log 也要实现持久性保护。undo log 是采用 segment（段）的方式来记录的，每个 undo 操作在记录的时候占用一个 undo log segment，包含在 rollback segment 中。</li><li>history list：history list 是 rollback segment header 的一部分，它的主要作用是记录所有已经提交但还没有被清理（purge）的事务的 undo log。这个列表使得 purge 线程能够找到并清理那些不再需要的 undo log 记录。</li></ul><div class="mermaid"></div><h3 id="常见问题-6" tabindex="-1">常见问题 <a class="header-anchor" href="#常见问题-6" aria-label="Permalink to &quot;常见问题&quot;">​</a></h3><details class="details custom-block"><summary>为什么需要两阶段提交？</summary><p>为了保证逻辑日志和物理日志的一致性；如果没有二阶段提价的话；如果插入操作先提交了 redo log 此时 undo log 还没有进行写盘此时断电了；再次重启数据库后 bin log 就无法感知导致从数据库比主数据库少一条数据； 如果先写入 bin log 再写入 redo log, 如果 bin log 完成写入后崩溃那么 redo log 就无法感知未记录的事务, 就会导致从数据中有这个事务但是主数据中没有。</p></details><!--]--></div><!--[--><

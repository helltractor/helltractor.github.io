con sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="sakura-nav-link-text &lt;lg:hidden" data-v-59573570>追番列表</span><!--[--><!--]--><!--]--></a><!--]--><!----></div><div class="sakura-dropdown sakura-navbar-link-item" aria-haspopup="true" aria-expanded="false" data-v-b00b65a0 data-v-6db7c45f data-v-ac3e8a66><!--[--><a class="va-link sakura-nav-link" title="RSS" rel="noopener" data-v-6db7c45f href="/atom.xml" target="_blank" data-v-59573570><!--[--><span class="i-ri-rss-line hvr-icon sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="&lt;lg:hidden sakura-nav-link-text" data-v-59573570>RSS</span><!--[--><!--]--><!--]--><!----></a><!--]--><!----></div><!--]--><!----></nav><!--]--><!--[--><div h-full print:op0 flex="~ center" class="sakura-navbar-tools"><button class="sakura-icon-btn sakura-toggle-dark select-none" type="button" aria-label="Toggle Color Scheme"><div class="i-line-md-moon-alt-to-sunny-outline-loop-transition"></div></button><!----><div flex="center"><button class="sakura-icon-btn sakura-search-btn" title="搜索"><div i-mdi-search></div></button><!----></div><!----><!--[--><!--]--></div><!--]--></div></header><!--]--><!--]--><main class="sakura-sidebar-offset sakura-main" data-v-1c94aaa0><!--[--><!--[--><!--[--><!--]--><!--[--><!--]--><!--[--><template><article class="markdown-body min-w-0"><!--[--><div class="max-w-none prose"><!--[--><details class="details custom-block"><summary>美团系统数据研发 Java 面经</summary><p>【一面】</p><ol><li>自我介绍不问实习和项目，上来就全八股</li><li>为什么 String 不可变，StringBuilder</li><li>synchronized 和 Reentranlock 详细介绍，哪些情况优先使用后者，或者说为什么解决什么问题而存在</li><li>上面锁的话，有什么注意事项</li><li>join 类型</li><li>sql 怎么优化</li><li>查看执行计划</li><li>explain 的属性</li><li>自动装配原理，流程</li><li>设计模式应用，好处</li><li>如何处理异常</li><li>哪里会打印日志</li><li>遇到性能瓶颈怎么解决核心代码模式，手撕旋转数组</li></ol><hr><p>【二面】</p><ol><li>自我介绍</li><li>实习相关</li><li>实习里面，有个点有串行执行，为什么不改成并行</li><li>如果这里成为系统的瓶颈，你怎么处理，异步失败了怎么处理</li><li>线程池</li><li>问我了不了解动态扩容的线程池（我说在看过美团技术的一个博客，讲解过，但自己没实现过）</li><li>对于抢票这样的业务，忙的时候要死，闲的时候也要死，你对于数据库的读写方式有什么考虑</li><li>mysql 和 redis 的数据一致性问题（被打麻了，我记得看过的都是不存在强一致性的吧，都存在至少一点点时间的错误）</li></ol><hr><p>作者：美团专业内推官 链接：<a href="https://www.nowcoder.com/interview/center?entranceType=%E5%AF%BC%E8%88%AA%E6%A0%8F" target="_blank" rel="noreferrer">https://www.nowcoder.com/interview/center?entranceType=导航栏</a> 来源：牛客网</p></details><details class="details custom-block"><summary>核心本地商业</summary><p>美团后端一面 3.24</p><ol><li>你的项目来源是什么，怎么想的做这些项目</li><li>项目有哪些难点（没提前准备这个问题，只能说没有印象深刻的难点，遇到问题网上搜一搜就解决了） <s>3.打包成 jar 包之后这些依赖包的位置在哪呢，java 是怎么识别的</s><s>4.介绍一下 jwt，他是怎么加密的</s><s>5.jwt 和传统的 cookie+session 有什么区别呢</s><s>6.为什么用 oss 存储，怎么不直接存在本地服务器</s> 7.为什么用 websocket 8.介绍一下 springtask 怎么实现检测超时订单 <s>9.用 mq 来解决这个业务的话，springtask 是不是就用不到了（不是，如果 mq 宕机了或者出现异常了可以用 springtask 进行兜底）</s><s>10.介绍一下 redis 旁路缓存</s><s>11.高并发查 redis 没有的数据怎么办（互斥锁）</s><s>12.没获取到锁的线程怎么处理（重试几次，抛异常，或者用逻辑过期返回旧数据）</s><s>13.redis 怎么实现分布式锁，setnx 有哪些参数</s><s>14.redisson 是怎么确定锁的拥有者的</s><s>15.介绍一下 jvm 内存模型</s></li><li>原空间存储的是什么信息呢</li><li>为什么原空间替代了永久代 <s>18.说一下堆的分代回收机制吧</s><s>19.有哪些垃圾回收算法</s><s>20.标记清除是怎么标记的（怎么确定是不是垃圾？）</s><s>21.说一下双亲委派机制，如果我自己定义了一个 java.lang.String，那能够使用吗？</s><s>22.介绍一下线程安全的类</s><s>23.concurrentHashMap 是怎么实现线程安全的？</s><s>24.介绍一下 mysql 的索引吧</s><s>25.说一下最左匹配原则</s><s>26.redis 的内存淘汰机制</s><s>27.介绍一下 redis 三件套</s></li></ol><p>手撕：删除链表的倒数第 n 个元素 反问</p><p>作者：SillyBoyy 链接：<a href="https://www.nowcoder.com/feed/main/detail/b3b9e455a7d44d2dbe27b2daf49b28a8?sourceSSR=users" target="_blank" rel="noreferrer">https://www.nowcoder.com/feed/main/detail/b3b9e455a7d44d2dbe27b2daf49b28a8?sourceSSR=users</a> 来源：牛客网</p><hr><p>美团后端二面 3.26（已 OC）</p><ol><li><s>介绍一下你的项目吧，你点餐系统的 jwt，redis ，Websocket 都是系统中干嘛的</s></li><li><s>有做身份鉴权，就是不同用户不同权限的（没有，用户在用户端权限是一样的，商家在商家端也是）</s></li><li><s>你 redis 的缓存策略用的什么</s></li><li><s>先更新数据库，再删除缓存，那如果删除缓存失败了怎么办，会回滚吗</s></li><li>回滚的话那 redis 挂掉了整个系统不就不可用了吗，你怎么解决</li><li>不用 websocket 怎么实现服务端消息推送</li><li><s>你遇到的项目的难点</s></li><li>讲一下你的点餐系统的模块吧，说一下有哪些表，他们的关系是什么</li><li><s>介绍一下第二个项目吧</s></li><li><s>讲一下缓存击穿和缓存穿透的区别，怎么解决</s></li><li><s>介绍一下 redis+lua 抢优惠券怎么实现的</s></li><li>怎么实现分布式锁</li><li><s>你是通过什么途径学习的</s></li><li><s>数据库有哪些隔离级别，都是怎么实现的</s></li><li>介绍一下 MVCC 的 ReadView</li><li>除了 MVCC 还用了什么实现的 （select for update）</li><li>介绍一下当前读是怎么加锁的</li><li>什么时候临建锁会退化为间隙锁或者记录锁</li><li>那什么时候不会退化呢</li><li>我要建立联合索引（a，b）怎么考虑哪个在前</li><li>怎么计算字段的区分度</li><li>怎么找慢查询的问题</li><li>Explain 的结果里面有哪些字段判断是否走了索引</li><li>语句走了索引，还是比我预期的多查了好几条，你觉得这是什么原因造成的呢</li><li>介绍一下 JUC 可重入锁的原理（AQS）</li><li>介绍一下 ReentrantLock 和 CountDownLatch 的区别</li><li>Spring 是如何解决循环依赖问题的</li></ol><p>手撕：数组 2 长度 n+m，m 个有序元素，后面 n 个 0，数组 2 有 n 个有序元素，要求把数组 2 合并到数组 1 （想原地修改，做了半天没 A 出来，最后换了个方法，开了个新数组归并写出来的）</p><p>作者：SillyBoyy 链接：<a href="https://www.nowcoder.com/feed/main/detail/a0cd1f45ce4c4c4baafcc9a0618918d2?sourceSSR=users" target="_blank" rel="noreferrer">https://www.nowcoder.com/feed/main/detail/a0cd1f45ce4c4c4baafcc9a0618918d2?sourceSSR=users</a> 来源：牛客网</p></details><!--]--></div><!--[--><!--]--><!--[--><!--]--><!--]--><!----><!----></article></template><!--]--><!--[--><!--]--><!--[--><!--]--><!--[--><!--]--><!----><!--[--><!--]--><!--]--><!--]--></main><!--[--><div data-v-1c94aaa0 style="display:none;" data-v-a46f6f61><div data-v-a46f6f61></div><img class="sakura-to-top-node" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEYAAABmCAMAAABBXBeAAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAvdQTFRFAAAAAAAAAgICAwMDDQsLDg0NCgkJAwICAAAACAcHBwYGFRISQyMecTYtAQAADAsLEQ8PNzU1WVVUaGhob29vdHR0bWpqVVBPJSQkERAQBgUFGBYWEBAQDQsLSkpKkZGRzMzM5OPk9PPz/////fv76enpzs7OpaWlZWVlMjAwExISDg0NAwEBHh4eBQUFBAQESEVEqKio9vb2//7+2dnZYGBgBAQEAgICDgoKKigoh4eH1tXV4ODgAQEBBgICGxkaOTk57e3t+Pj4/v39tLS0xsbGQD4+FBMTCAgIGxISGxgYq6ur/Pr63NzcoaGhmZmZAAAAEg8Pv7+/0tLSlJSUjY2NFRQUFBQUAwAADQwMLx8fISAg8fHxubm5iYmJSC8uBQUFDgwM6+vrenp6g4KCBAEBr6+vFhUVwbKy5+fnnZ2dHRwcybu65tjY6t3c8eno+PT0XFxct6mp5NbV4dPR4dHQ6NnZ9vDwYmJiQkJCGhgXsKWk5tbW4M/P6t/e+vb2DAsLAgEB18PD49TT38zL49PS387N3MjK+/j4zMrKFxYW4cXRZGRk+PHzFxUV0L282tra7

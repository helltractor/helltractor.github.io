con sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="sakura-nav-link-text &lt;lg:hidden" data-v-59573570>追番列表</span><!--[--><!--]--><!--]--></a><!--]--><!----></div><div class="sakura-dropdown sakura-navbar-link-item" aria-haspopup="true" aria-expanded="false" data-v-b00b65a0 data-v-6db7c45f data-v-ac3e8a66><!--[--><a class="va-link sakura-nav-link" title="RSS" rel="noopener" data-v-6db7c45f href="/atom.xml" target="_blank" data-v-59573570><!--[--><span class="i-ri-rss-line hvr-icon sakura-icon sakura-nav-link-icon mr-0.5" inline-flex data-v-59573570></span><span truncate class="&lt;lg:hidden sakura-nav-link-text" data-v-59573570>RSS</span><!--[--><!--]--><!--]--><!----></a><!--]--><!----></div><!--]--><!----></nav><!--]--><!--[--><div h-full print:op0 flex="~ center" class="sakura-navbar-tools"><button class="sakura-icon-btn sakura-toggle-dark select-none" type="button" aria-label="Toggle Color Scheme"><div class="i-line-md-moon-alt-to-sunny-outline-loop-transition"></div></button><!----><div flex="center"><button class="sakura-icon-btn sakura-search-btn" title="搜索"><div i-mdi-search></div></button><!----></div><!----><!--[--><!--]--></div><!--]--></div></header><!--]--><!--]--><main class="sakura-sidebar-offset sakura-main" data-v-1c94aaa0><!--[--><!--[--><!--[--><!--]--><!--[--><!--]--><!--[--><template><article class="markdown-body min-w-0"><!--[--><div class="max-w-none prose"><!--[--><h2 id="题型" tabindex="-1">题型 <a class="header-anchor" href="#题型" aria-label="Permalink to &quot;题型&quot;">​</a></h2><p>6 + 2：6 个技术基础知识考察题及 2 个通用能力考察题</p><h2 id="面经" tabindex="-1">面经 <a class="header-anchor" href="#面经" aria-label="Permalink to &quot;面经&quot;">​</a></h2><ol><li>TCP 与 UDP 的使用场景，以及区别 <ul><li>TCP 是面向连接的、可靠的传输协议，适用于数据准确性和顺序性的使用场景，如文件传输、邮件发送等。</li><li>UDP 是面向无连接的、不可靠的传输协议，适用于实时性要求高的使用场景，如视频直播、语音通话等。</li></ul></li><li>Linux 如何排查与诊断端口问题 <ul><li><code>netstat</code>、<code>lsof</code>、<code>ps</code>、<code>ss</code>等命令</li><li><code>netstat -tunlp</code>查看端口占用情况</li><li><code>lsof -i:端口号</code>查看端口占用的进程</li><li><code>ps -ef | grep 进程名</code>查看进程详细信息</li><li><code>ss -tunlp</code>查看端口占用情况</li><li><code>kill -9 进程号</code>强制杀死进程</li></ul></li><li>Java 中 static 与 final 的作用 <ul><li><code>static</code>用于修饰类、方法、变量，表示静态的，属于类的，可以通过类名直接访问。</li><li><code>final</code>用于修饰类、方法、变量，表示不可继承、不可重写、不可修改，常用于常量、单例模式等。</li></ul></li><li>ArrayList 与 LinkedList 的区别与使用场景 <ul><li><code>ArrayList</code>基于数组实现，查询效率高，增删效率低，适用于查询频繁的场景。</li><li><code>LinkedList</code>基于链表实现，查询效率低，增删效率高，适用于增删频繁的场景。</li></ul></li><li>数据库查询优化器有什么作用 <ul><li>数据库查询优化器负责解析 SQL 语句，生成查询计划，优化查询性能。</li><li>通过索引、统计信息、执行计划等手段，选择最优的查询路径，提高查询效率。</li></ul></li><li>设计一个排行榜功能，如何设计数据结构与内存策略（如何保证数据一致性以及实时性） <ul><li>使用有序集合存储排行榜数据，如 Redis 的<code>ZSET</code>。</li><li>使用 Redis 缓存+定时任务或消息队列更新排行榜数据，保证数据一致性和实时性。</li></ul></li><li>如何与最新的技术与时俱进，通过什么方式学习，各有什么优缺点，并根据你的回答引申出去 <ul><li>通过阅读官方文档、博客、书籍、实践项目、参加技术交流会议等方式学习。</li><li>优点：及时了解最新技术、拓展视野、提升技术能力。</li><li>缺点：信息量大、更新快、深度和广度有限。</li></ul></li><li>项目中遇到什么问题，如何解决的，并根据你的回答引申出去 <ul><li>项目中遇到的问题：如性能瓶颈、安全漏洞、数据丢失等。</li><li>解决方法：如优化算法、增加缓存、加强安全防护等。</li></ul></li><li>未来 3 年的职业规划 <ul><li>夯实技术基础、进阶技术架构、提升管理能力、拓展业务视野等。</li><li>第一年：熟悉公司业务、技术栈、团队合作等。夯实技术基础、提升编程能力、熟悉业务流程等。</li><li>第二年：深入研究技术领域、参与项目设计、解决技术难题等。进阶技术架构、提升团队协作、拓展业务视野等。</li><li>第三年：担任技术负责人、项目经理、架构师等职位，负责项目规划、团队管理、技术选型等。提升管理能力、拓展业务视野、实现职业目标等。</li></ul></li></ol><blockquote><p>作者：Mia_san_mia_mia_san_mia <br> 链接：<a href="https://www.nowcoder.com/feed/main/detail/5dbe9855b7bd4e688763d59cbbc30653?sourceSSR=search" target="_blank" rel="noreferrer">https://www.nowcoder.com/feed/main/detail/5dbe9855b7bd4e688763d59cbbc30653?sourceSSR=search</a> <br> 来源：牛客网</p></blockquote><hr><ol><li><s>TCP 与 UDP</s></li><li>string 类可不可以被继承？为什么 <ul><li><code>String</code>类是<code>final</code>修饰的，不可被继承，防止被修改。</li><li><code>String</code>类是不可变的字符串，提高字符串的安全性和性能。</li></ul></li><li>修改用户权限和所有权的命令是什么 <ul><li><code>chown</code>修改文件所有者</li><li><code>chmod</code>修改文件权限</li></ul></li><li>设计一个预约系统，会考虑什么 <ul><li>预约系统需考虑用户需求、时间段、资源分配、冲突处理等。</li><li>可以使用数据库存储预约信息，使用定时任务处理预约逻辑。</li><li>可以使用消息队列处理预约通知、提醒等。</li><li>可以使用缓存存储热门预约信息，提高查询效率。</li><li>可以使用分布式锁处理并发预约问题。</li></ul></li><li><s>如何实现预约时间段的细化</s></li><li><s>平时是如何学习新技术的，通过哪些方式？（我说了 ai，追问如何使用 ai）</s></li><li>项目短期实现和长期维护之间的平衡 <ul><li>在软件开发中，短期目标通常是快速交付，确保项目按时上线；长期目标是稳定、可扩展、易维护。</li></ul></li><li><s>未来三年的发展规划</s></li></ol><blockquote><p>作者：明朝老兵在线背八股 <br> 链接：<a href="https://www.nowcoder.com/feed/main/detail/6d302a6b7d2e44f99036e45c5d3db4ef?sourceSSR=search" target="_blank" rel="noreferrer">https://www.nowcoder.com/feed/main/detail/6d302a6b7d2e44f99036e45c5d3db4ef?sourceSSR=search</a> <br> 来源：牛客网</p></blockquote><hr><ol><li><s>TCP 与 UDP 的使用场景，以及区别</s></li><li>Linux 查看文件的内容，列举至少 3 个相关命令 <ul><li><code>cat</code>查看文件内容</li><li><code>more</code>分页查看文件内容</li><li><code>less</code>分页查看文件内容</li><li><code>head</code>查看文件头部内容</li><li><code>tail</code>查看文件尾部内容</li></ul></li><li>解释一下三大日志以及区别 <ul><li><code>INFO</code>信息日志，记录程序正常运行的信息</li><li><code>WARN</code>警告日志，记录程序可能出现问题的信息</li><li><code>ERROR</code>错误日志，记录程序出现错误的信息</li></ul></li><li>如何创建和启动一个线程 <ul><li>继承<code>Thread</code>类并重写<code>run</code>方法</li><li>实现<code>Runnable</code>接口并实现<code>run</code>方法</li><li>使用<code>ExecutorService</code>线程池</li></ul></li><li>解释 Java 中的构造函数，构造函数能够重载吗 <ul><li>构造函数是类的特殊方法，用于初始化对象</li><li>构造函数可以重载，但不能被继承</li></ul></li><li><s>设计文章热度计算系统考虑浏览量、评论数和分享数等因素</s></li><li><s>各自的权重分数如何考虑的</s><ul><li>浏览量、评论数、分享数等因素可以设置不同的权重，如<code>0.3</code>、<code>0.5</code>、<code>0.2</code>等。</li><li>可以使用加权平均法、加权求和法等计算热度分数。</li><li>可以使用缓存存储热度数据，提高查询效率。</li></ul></li><li><s>如何与最新的技术与时俱进，通过什么方式学习，各有什么优缺点，并根据你的回答引申出去</s></li><li>项目中遇到什么问题，如何解决的，并根据你的回答引申出去 <ul><li>高并发下数据库压力过大，导致性能下降 <ul><li>使用 Redis 缓存热点数据，减轻数据库压力</li><li>使用分库分表、读写分离等方式优化数据库，读操作和写操作分离，读操作走从库，写操作走主库</li><li>使用消息队列异步处理数据，提高系统吞吐量，用户下单时，先将订单信息写入消息队列，后台系统异步消费消息，生成订单</li></ul></li></ul></li><li><s>未来 3 年的职业规划</s></li></ol><blockquote><p>作者：presbyterwar <br> 链接：<a href="https://www.nowcoder.com/feed/main/detail/ed1f9ce71510442b90f92240224c9b5e?sourceSSR=search" target="_blank" rel="noreferrer">https://www.nowcoder.com/feed/main/detail/ed1f9ce71510442b90f92240224c9b5e?sourceSSR=search</a> <br> 来源：牛客网</p></blockquote><hr><ol><li>threadlocal <ul><li><code>ThreadLocal</code>是 Java 中的线程本地变量，每个线程都有自己的<code>ThreadLocal</code>变量，互不干扰。</li><li><code>ThreadLocal</code>提供了<code>get</code>、<code>set</code>、<code>remove</code>等方法，用于存储线程私有数据。</li><li><code>ThreadLocal</code>常用于解决线程安全问题，如数据库连接、Session 管理等。</li><li><code>ThreadLocal</code>的内存泄漏问题，需要注意及时清理。</li><li><code>ThreadLocal</code>的原理是通过<code>ThreadLocalMap</code>实现，每个线程都有一个<code>ThreadLocalMap</code>，存储<code>ThreadLocal</code>变量。</li></ul></li><li>linux 端口命令 <ul><li><code>netstat</code>查看网络状态</li><li><code>lsof</code>查看打开的文件</li><li><code>ps</code>查看进程信息</li><li><code>ss</code>查看套接字信息</li></ul></li><li>数据库分区表 <ul><li>数据库分区表是将一个大表按照某种规则分成多个小表，提高查询效率。</li><li>数据库分区表可以按照时间、范围、哈希等方式分区。</li><li>数据库分区表可以减少单表数据量，提高查询性能。</li><li>数据库分区表可以减少索引大小，提高索引效率。</li><li>数据库分区表可以减少锁竞争，提高并发性能。</li></ul></li><li>第三方支付接口超时怎么对账监控，接口的幂等性和重复多次下单 <ul><li>使用定时任务或消息队列监控支付接口超时情况，及时处理异常订单。</li><li>使用幂等性机制保证接口的幂等性，避免重复下单。</li><li>使用分布式锁处理并发下单问题，避免重复下单。</li></ul></li><li><s>未来三年职业规划</s></li><li>项目人员资源缺乏人员紧缺的时候怎么应对举个例子 <ul><li>项目人员资源紧缺时，可以通过招聘、外包、培训等方式解决。</li><li>项目人员资源紧缺时，可以通过技术分享、团队合作等方式提高团队效率。</li><li>项目人员资源紧缺时，可以通过项目管理、任务分配等方式合理分配资源。</li></ul></li><li>怎么学习一个新的编程语言或框架 追问怎么用的 接着又对上面回答进行追问 <ul><li>学习新编程语言或框架可以通过阅读官方文档、博客、书籍、实践项目等方式。</li><li>学习新编程语言或框架可以通过参加技术交流会议、培训课程等方式。</li><li>学习新编程语言或框架可以通过实践项目、开源项目等方式。</li><li>学习新编程语言或框架可以通过编写代码、调试代码、提交代码等方式。</li></ul></li><li>粘包问题怎么解决 <ul><li>粘包问题是 TCP 协议中常见的问题，多个数据包粘在一起发送。</li><li>可以通过消息定长、消息分隔符、消息长度字段等方式解决粘包问题。</li><li>可以通过 Netty 等网络框架解决粘包问题。</li><li>可以通过自定义协议解决粘包问题，如 HTTP 协议、WebSocket 协议等。</li></ul></li><li>hashcode 和 equals <ul><li><code>hashCode</code>是<code>Object</code>类的方法，用于计算对象的哈希码。</li><li><code>equals</code>是<code>Object</code>类的方法，用于比较对象的内容是否相等。</li><li><code>hashCode</code>和<code>equals</code>方法通常需要同时重写，保证对象的一致性。</li><li><code>hashCode</code>和<code>equals</code>方法通常需要保证一致性，即相等的对象哈希码相等，哈希码相等的对象不一定相等。</li></ul></li></ol><blockquote><p>作者：evakkkkkk <br> 链接：<a href="https://www.nowcoder.com/feed/main/detail/d22c0184223a4dd887f9979503daf4cf?sourceSSR=search" target="_blank" rel="noreferrer">https://www.nowcoder.com/feed/main/detail/d22c0184223a4dd887f9979503daf4cf?sourceSSR=search</a> <br> 来源：牛客网</p></blockquote><hr><p>技术题</p><ol><li>HTTP 请求头和响应头都有什么，分别有什么作用？描述从输入 url 到页面展示的完整过程。 <ul><li>HTTP 请求头：包括请求行、请求头、请求体，用于向服务器发送请求信息。</li><li>HTTP 响应头：包括状态行、响应头、响应体，用于向客户端返回响应信息。</li><li>输入 URL 到页面展示过程：DNS 解析、建立 TCP 连接、发送 HTTP 请求、服务器处理请求、服务器返回响应、浏览器渲染页面。</li></ul></li><li>Linux 内存管理，物理内存和虚拟内存区别和作用？Linux 用什么命令来修改文件的所有者或组？ <ul><li>物理内存是实际的内存条，虚拟内存是操作系统为每个进程分配的内存空间。</li><li>物理内存是硬件资源，虚拟内存是操作系统资源。</li><li>物理内存是实际存储数据的地方，虚拟内存是操作系统管理内存的抽象概念。</li><li>修改文件所有者或组的命令：<code>chown</code>修改文件所有者，<code>chgrp</code>修改文件组。</li></ul></li><li>Java 中的 ThreadLocal？Java 在 finally 中 return 会发生什么？解释 volatile 关键字及其作用？ <ul><li><code>ThreadLocal</code>是 Java 中的线程本地变量，每个线程都有自己的<code>ThreadLocal</code>变量，互不干扰。</li><li>在<code>finally</code>中<code>return</code>会先执行<code>return</code>语句，然后再执行<code>finally</code>块中的代码。</li><li><code>volatile</code>关键字用于修饰变量，保证变量的可见性、有序性、禁止指令重排序。</li></ul></li><li>Java 中的多态？如何实现多态？ <ul><li>多态是指同一个方法调用，不同对象产生不同的行为。</li><li>多态实现方式：方法重载、方法重写、接口实现、继承父类等。</li></ul></li><li>暂时忘了</li><li>电商系统如何设计什么什么的逻辑，解决超卖问题（会追问） <ul><li>电商系统设计：用户注册、商品展示、购物车、下单、支付、物流、评价等。</li><li>解决超卖问题：使用分布式锁、乐观锁、悲观锁、队列等方式解决。</li></ul></li></ol><p>通用题</p><ol><li>你认为在软件开发领域当中应该提升什么核心能力？你有什么提升计划？有没有什么指标来衡量你的提升效果？有没有用什么工具来帮助你提升？（追问）</li><li><s>在你的项目中遇到了什么复杂的问题，你是怎么找到它的根本原因的？（追问）</s></li><li><s>未来三年的职业规划？</s></li></ol><p>作者：清风徐来___ 链接：<a href="https://www.nowcoder.com/" target="_blank" rel="noreferrer">https://www.nowcoder.com/</a> 来源：牛客网</p><hr><p>技术题</p><ol><li>TCP 和 UDP 的使用场景和区别？</li><li>linux 中 Pineline 的是什么？具体使用场景？</li><li>数据库中判断索引的性能？</li><li>忘记了</li><li>String，StringBuffer，StringBuilder 的区别？</li><li>简单的网页搜索功能，如何设计？（追问）</li></ol><p>通用题</
